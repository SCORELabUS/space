name: Integration Tests Run
on:
  pull_request:
    branches:
      - 'develop'
      - 'main'

# A pull request opened from a fork does not receive the `testing` environment's
# secrets or variables, so every `vars.*` and `secrets.*` below resolves to an
# empty string on those runs. The `|| '...'` fallbacks keep the job
# self-sufficient; where the environment is available, its values still win.
#
# The fallbacks are not arbitrary. MONGO_URI is hard-coded, so the container the
# suite talks to has to listen on 27017 and hold `space_testing_db` for the
# tests to connect at all - the two variables cannot hold anything else without
# breaking the run. JWT_SECRET and JWT_SALT are only a key and a pbkdf2 salt for
# tokens minted and verified inside the same run, so any non-empty pair works.
jobs:
  build:
    name: Test
    runs-on: ubuntu-latest
    environment: testing
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Make envfile
        uses: SpicyPizza/create-envfile@v2.0
        with:
          envkey_ENVIRONMENT: "testing"
          envkey_DATABASE_NAME: ${{ vars.CI_MONGO_INITDB_DATABASE || 'space_testing_db' }}
          envkey_MONGO_URI: mongodb://localhost:27017/space_testing_db?authSource=space_testing_db
          envkey_ADMIN_USER: "admin"
          envkey_ADMIN_PASSWORD: "4dm1n"
          envkey_REDIS_URL: "redis://localhost:6379"
          envkey_JWT_SECRET: ${{ secrets.CI_JWT_SECRET || 'ci_test_secret' }}
          envkey_JWT_EXPIRATION: "1h"
          envkey_JWT_SALT: ${{ secrets.CI_JWT_SALT || 'ci_test_salt' }}
          
          directory: .
          file_name: api/.env
          fail_on_empty: false
          sort_keys: false

      - name: Start MongoDBs
        uses: supercharge/mongodb-github-action@1.10.0
        with:
          mongodb-version: '7.0.16'
          mongodb-db: ${{ vars.CI_MONGO_INITDB_DATABASE || 'space_testing_db' }}
          mongodb-port: ${{ vars.CI_MONGO_PORT || '27017' }}

      - name: Start Redis
        uses: shogo82148/actions-setup-redis@v1
        with:
          redis-version: '7.x'

      - name: Install pnpm
        run: npm install -g pnpm@9.15.9

      - name: Install dependencies
        run: pnpm i

      - name: Run tests
        run: pnpm run test

      - name: Set up .NET for pricing-token interoperability example
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify pricing tokens from .NET without a SPACE SDK
        run: |
          pnpm --dir api exec tsx src/test/utils/pricingTokenInteropFixtures.ts /tmp/space-token-fixtures.json
          dotnet run --project docs/examples/pricing-token-dotnet -- --self-test /tmp/space-token-fixtures.json

  identity:
    name: SPHERE identity integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ENVIRONMENT: testing
      DATABASE_TECHNOLOGY: mongoDB
      DATABASE_NAME: space_identity_scratch
      MONGO_URI: mongodb://127.0.0.1:27018/space_identity_scratch
      REDIS_URL: redis://127.0.0.1:6378
      REDIS_KEY_PREFIX: 'space-identity-ci:'
      SERVER_PORT: '0'
      SEED_ON_STARTUP: 'false'
    services:
      mongodb:
        image: mongo:7.0.16
        ports: ['27018:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4.2
        ports: ['6378:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Install pnpm
        run: npm install -g pnpm@10.9.0
      - name: Install API dependencies
        run: pnpm --dir api install --frozen-lockfile
      - name: Test isolated SPHERE identity persistence
        run: pnpm --dir api run test:identity
