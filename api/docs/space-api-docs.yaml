  /organizations:
    get:
      summary: List organizations with optional filtering and pagination
      description: |
        Retrieves a list of organizations accessible to the authenticated user.

        **Authentication**: User API Key

        **Permission**: 
        - ADMIN users: can see all organizations with pagination and filtering
        - Regular users: can see only their own organizations (as owner or member) without pagination

        **Two response formats based on user role**:
        
        1. **ADMIN Users** (paginated response):
           - Returns all organizations in the system with pagination
           - Supports search filtering by organization name
           - Use `offset` and `limit` to paginate through results
           - Returns object with `data` array and `pagination` metadata
        
        2. **Regular Users** (non-paginated response):
           - Returns only organizations where user is owner or member
           - No pagination applied
           - Returns object with `data` array only (no pagination metadata)
           - Query parameters for pagination are ignored

      tags:
        - Organizations
      security:
        - ApiKeyAuth: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: |
            Search query to match against organization names (case-insensitive regex).
            Only applies to ADMIN users.
            - If provided: filters organizations by name
            - If not provided or empty: returns all organizations
          example: ACME
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
          description: |
            Maximum number of results to return per page.
            Only applies to ADMIN users. Regular users receive all their organizations.
          example: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: |
            Number of records to skip (for pagination).
            Only applies to ADMIN users.
          example: 0
      responses:
        '200':
          description: Organizations list (format varies by user role)
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    description: Paginated response for ADMIN users
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Organization'
                        description: Array of organization objects
                      pagination:
                        type: object
                        properties:
                          offset:
                            type: integer
                            description: Current offset value
                            example: 0
                          limit:
                            type: integer
                            description: Current limit value
                            example: 10
                          total:
                            type: integer
                            description: Total number of organizations (filtered by search query if provided)
                            example: 42
                          page:
                            type: integer
                            description: Current page number (1-indexed)
                            example: 1
                          pages:
                            type: integer
                            description: Total number of pages
                            example: 5
                  - type: object
                    description: Non-paginated response for regular users
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Organization'
                        description: Array of organizations where user is owner or member
              examples:
                adminSearchResults:
                  summary: ADMIN - Search results for organizations matching "ACME"
                  value:
                    data:
                      - id: 507f1f77bcf86cd799439011
                        name: ACME Corporation
                        owner: john_doe
                        members: []
                        apiKeys:
                          - key: org_abc123
                            scope: ALL
                        default: true
                      - id: 507f1f77bcf86cd799439012
                        name: ACME Industries
                        owner: jane_smith
                        members:
                          - username: john_doe
                            role: MANAGER
                        apiKeys:
                          - key: org_def456
                            scope: ALL
                        default: false
                    pagination:
                      offset: 0
                      limit: 10
                      total: 2
                      page: 1
                      pages: 1
                adminListAll:
                  summary: ADMIN - List of all organizations (page 1)
                  value:
                    data:
                      - id: 507f1f77bcf86cd799439011
                        name: ACME Corporation
                        owner: john_doe
                        members: []
                        apiKeys:
                          - key: org_abc123
                            scope: ALL
                        default: true
                      - id: 507f1f77bcf86cd799439012
                        name: Tech Startup
                        owner: jane_smith
                        members: []
                        apiKeys:
                          - key: org_def456
                            scope: ALL
                        default: false
                    pagination:
                      offset: 0
                      limit: 10
                      total: 42
                      page: 1
                      pages: 5
                regularUserOrganizations:
                  summary: Regular User - Organizations where user is owner or member
                  value:
                    data:
                      - id: 507f1f77bcf86cd799439011
                        name: My Organization
                        owner: john_doe
                        members: []
                        apiKeys:
                          - key: org_abc123
                            scope: ALL
                        default: true
                      - id: 507f1f77bcf86cd799439013
                        name: Shared Project
                        owner: jane_smith
                        members:
                          - username: john_doe
                            role: EVALUATOR
                        apiKeys:
                          - key: org_ghi789
                            scope: ALL
                        default: false
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              examples:
                invalidLimit:
                  summary: Limit out of range
                  value:
                    error: "INVALID DATA: Limit must be between 1 and 50"
                invalidOffset:
                  summary: Negative offset
                  value:
                    error: "INVALID DATA: Offset must be a non-negative number"
        '401':
          description: Unauthorized - missing or invalid API key

    post:
      summary: Create organization
      description: |
        Creates a new organization with the specified owner and details.

        **Authentication**: User API Key

        **Permission**: 
        - ADMIN users: can create for any user
        - Regular users: can only create for themselves

        **Automatic Setup**:
        - Creator becomes organization owner
        - Organization receives initial API Key with ALL scope

      tags:
        - Organizations
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - owner
              properties:
                name:
                  type: string
                  example: ACME Corporation
                owner:
                  type: string
                  example: john_doe
      responses:
        '201':
          description: Organization created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          description: Invalid organization data
        '403':
          description: Forbidden - cannot create for other users (USER role)
        '404':
          description: Owner user does not exist
        '409':
          description: Owner already has a default organization

  /organizations/{organizationId}:
    get:
      summary: Get organization details
      description: |
        Retrieves complete information about a specific organization including 
        members, API keys, and metadata.

        **Authentication**: User API Key

        **Permission**: 
        - USER user can only view organizations they own or are a member of
        - ADMIN users can view any organization

      tags:
        - Organizations
      security:
        - ApiKeyAuth: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
            format: MongoDB ObjectId
          example: 507f1f77bcf86cd799439011
      responses:
        '200':
          description: Organization details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - not a member of this organization
        '404':
          description: Organization not found

    put:
      summary: Update organization
      description: |
        Updates organization properties including name and ownership.

        **Authentication**: User API Key

        **Permission**: 
        - Organization OWNER: can update name and transfer ownership
        - Organization ADMIN: can update name only
        - Organization MANAGER: can update name only
        - ADMIN user: can update name and transfer ownership

      tags:
        - Organizations
      security:
        - ApiKeyAuth: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Updated Organization Name
                owner:
                  type: string
                  example: new_owner_username
                  description: Must be an existing username (owner permission required)
      responses:
        '200':
          description: Organization updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          description: Invalid update data
        '403':
          description: Forbidden - insufficient permissions
        '404':
          description: Organization or specified owner not found
        '409':
          description: New owner already has a default organization

    delete:
      summary: Delete organization
      description: |
        Deletes an organization and all its resources (services, contracts, API keys, members).

        **Authentication**: User API Key

        **Permission**: 
        - Organization OWNER: can delete the organization they own
        - ADMIN user: can delete any organization

        **Constarints**:
        - Cannot delete default organizations

        **Cascading Deletions**:
        - All services and pricing versions are deleted
        - All contracts are deleted
        - All members are removed
        - All API keys are invalidated

      tags:
        - Organizations
      security:
        - ApiKeyAuth: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Organization deleted successfully
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - cannot delete default organization or insufficient permissions
        '404':
          description: Organization not found

  /organizations/{organizationId}/members:
    post:
      summary: Add member to organization
      description: |
        Adds a user to the organization with a specified role.

        **Authentication**: User API Key

        **Permission**: 
        - Organization OWNER: can add any member with any role
        - Organization ADMIN: can add any member with any role
        - Organization MANAGER: can add any member with MANAGER/EVALUATOR roles (not OWNER/ADMIN)
        - ADMIN user: can add with any role

      tags:
        - Organizations
      security:
        - ApiKeyAuth: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - role
              properties:
                username:
                  type: string
                  example: user_to_add
                role:
                  type: string
                  enum: [ADMIN, MANAGER, EVALUATOR]
                  example: MANAGER
      responses:
        '200':
          description: Member added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          description: Invalid member data
        '403':
          description: Forbidden - cannot grant this role (insufficient permissions)
        '404':
          description: Organization or user not found

  /organizations/{organizationId}/members/{username}:
    put:
      summary: Update member role in organization
      description: |
        Updates the role of a member within the organization. Only users with appropriate permissions can change member roles.

        **Authentication**: User API Key

        **Permission Model**:
        - **SPACE Admin**: Can promote/demote any member to any role (except OWNER)
        - **Organization OWNER**: Can promote/demote any member (except themselves) to any role (except OWNER)
        - **Organization ADMIN**: Can promote/demote any member (except OWNER and other ADMINs) to any role (except OWNER and ADMIN)
        - **Organization MANAGER**: Can promote/demote MANAGER and EVALUATOR members to lower roles (MANAGER/EVALUATOR only)
        - **Organization EVALUATOR and below**: No permission to change roles

        **Available Roles**: ADMIN, MANAGER, EVALUATOR

        **Constraints**:
        - Cannot change OWNER's role (organization owner cannot be downgraded)
        - Cannot assign OWNER role (OWNER role is special, only changed via organization transfer)
        - Cannot update a member to their current role (must be a different role)
        - Member must initially exist in the organization

      tags:
        - Organizations
      security:
        - ApiKeyAuth: []
      parameters:
        - name: organizationId
          in: path
          required: true
          description: The organization ID (must be valid MongoDB ObjectId)
          schema:
            type: string
            format: uuid
        - name: username
          in: path
          required: true
          description: The username of the member whose role is being updated
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - role
              properties:
                role:
                  type: string
                  enum: [ADMIN, MANAGER, EVALUATOR]
                  description: The new role to assign to the member
            examples:
              promoteToAdmin:
                summary: Promote member to ADMIN
                value:
                  role: ADMIN
              demoteToEvaluator:
                summary: Demote member to EVALUATOR
                value:
                  role: EVALUATOR
      responses:
        '200':
          description: Member role updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          description: Invalid data or request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              examples:
                nonExistentMember:
                  summary: Member does not exist
                  value:
                    error: "INVALID DATA: User with username nonexistent_user is not a member of the organization."
                ownerRole:
                  summary: Cannot change owner's role
                  value:
                    error: "INVALID DATA: Cannot change the role of the organization owner."
                invalidOrganization:
                  summary: Invalid organization ID format
                  value:
                    error: "INVALID DATA: Invalid organization ID"
        '403':
          description: Forbidden - User lacks required permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              examples:
                noPermission:
                  summary: User cannot update member roles
                  value:
                    error: "PERMISSION ERROR: Only SPACE admins or organization-level OWNER, ADMIN and MANAGER can update member roles."
                escalatedPermission:
                  summary: Manager trying to promote to ADMIN
                  value:
                    error: "PERMISSION ERROR: Only SPACE admins or organization-level OWNER/ADMIN can add high-level members."
        '404':
          description: Organization not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              examples:
                notFound:
                  summary: Organization does not exist
                  value:
                    error: "Organization with ID 000000000000000000000000 not found"
        '409':
          description: Conflict - Member already has the target role
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              examples:
                sameRole:
                  summary: Member already has this role
                  value:
                    error: "CONFLICT: User with username john_doe already has the role EVALUATOR."
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              examples:
                missingRole:
                  summary: Missing role field
                  value:
                    error: "Validation error: role field is required"
                invalidRole:
                  summary: Invalid role value
                  value:
                    error: "Validation error: role must be one of ADMIN, MANAGER, EVALUATOR"
                invalidRoleType:
                  summary: Role is not a string
                  value:
                    error: "Validation error: role must be a string"
                ownerRoleAttempt:
                  summary: Attempting to assign OWNER role
                  value:
                    error: "Validation error: OWNER role cannot be assigned via this endpoint"

    delete:
      summary: Remove specific member from organization
      description: |
        Removes a user from the organization.

        **Authentication**: User API Key

        **Permission**: 
        - Organization OWNER: can remove any member
        - Organization ADMIN: can remove members except other ADMINs or OWNER
        - Organization MANAGER: can remove MANAGER/EVALUATOR only  
        - Organization EVALUATOR: can only remove themselves
        - ADMIN user: can remove any member

      tags:
        - Organizations
      security:
        - ApiKeyAuth: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Member removed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '403':
          description: Forbidden
        '404':
          description: Organization or member not found

  /organizations/{organizationId}/api-keys:
    post:
      summary: Create organization API Key
      description: |
        Creates a new API Key for the organization with the specified scope.

        **Authentication**: User API Key

        **Permission**: 
        - Organization OWNER: can create any scope
        - Organization ADMIN: can create any scope
        - Organization MANAGER: can create MANAGEMENT/EVALUATION scopes only
        - ADMIN user: can create any scope

        **Scopes**:
        - `ALL`: Unrestricted access to all organization operations
        - `MANAGEMENT`: Create, update, delete operations (read access included)
        - `EVALUATION`: Read-only access to services/pricings + feature evaluation (including the expected
          consumption of a single-feature evaluation and its revert) and pricing tokens

      tags:
        - Organizations
      security:
        - ApiKeyAuth: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - scope
              properties:
                scope:
                  type: string
                  enum: [ALL, MANAGEMENT, EVALUATION]
                  example: MANAGEMENT
      responses:
        '200':
          description: API Key created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          description: Invalid scope value
        '403':
          description: Forbidden - cannot grant this scope (MANAGER cannot create ALL scope)
        '404':
          description: Organization not found

  /organizations/{organizationId}/api-keys/{apiKeyId}:
    delete:
      summary: Remove organization API Key
      description: |
        Removes an API Key from the organization, immediately invalidating it.

        **Authentication**: User API Key

        **Permission**: 
        - Organization OWNER: can remove any key
        - Organization ADMIN: can remove any key
        - Organization MANAGER: can remove non-ALL scope keys only
        - ADMIN user: can remove any key

      tags:
        - Organizations
      security:
        - ApiKeyAuth: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
        - name: apiKey
          in: path
          required: true
          schema:
            type: string
          description: The API Key value to remove
      responses:
        '200':
          description: API Key removed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '403':
          description: Forbidden - cannot remove ALL-scope key (MANAGER)
        '404':
          description: API Key not found

  /organizations/{organizationId}/services:
    get:
      summary: List services in organization
      description: |
        Lists all services configured in the organization.

        **Authentication**: User API Key

        **Permission**: 
        - USER user: must be an organization member with any role (OWNER/ADMIN/MANAGER/EVALUATOR)
        - ADMIN user: can view services in any organization

      tags:
        - Services
      security:
        - ApiKeyAuth: []
      parameters:
        - in: query
          name: disabled
          description: Select disabled services instead of active services (default false).
          schema: { type: boolean, default: false }
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Service'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - not a member of this organization or insufficient scope

    post:
      summary: Create service in organization
      description: |
        Creates a new service in the organization.

        **Authentication**: User API Key

        **Permission**: 
        - USER user: OWNER/ADMIN/MANAGER role required
        - ADMIN user: can create services in any organization

      tags:
        - Services
      security:
        - ApiKeyAuth: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/SphereCreateService'
                - type: object
                  required: [pricing]
                  properties:
                    pricing: { type: string, format: uri }
          multipart/form-data:
            schema:
              type: object
              required:
                - pricing
              properties:
                name:
                  type: string
                  example: Zoom
                description:
                  type: string
                  example: Video conferencing and web meeting platform
                pricing:
                  type: string
                  format: binary
                  description: Optional pricing YAML/JSON file
      responses:
        '201':
          description: Service created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '400':
          description: Invalid service data
        '403':
          description: Forbidden - insufficient permissions
        '404':
          description: Organization not found

    delete:
      summary: Delete all services in organization
      description: |
        Deletes all services (enabled and disabled) and associated pricings in the organization (irreversible
        operation), after removing them from every contract of the organization (see "Disabling and deleting
        services"). A platform ADMIN user deletes the services of this organization only.

        **Authentication**: User API Key

        **Permission**: 
        - USER user: OWNER/ADMIN role required
        - ADMIN user: can delete services in any organization

      tags:
        - Services
      security:
        - ApiKeyAuth: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: All services deleted (`{ message }`)
        '403':
          description: Forbidden - insufficient permissions
        '404':
          description: Organization not found
        '409':
          description: A contract kept changing while the services were removed from it; nothing was deleted, retry
        '500':
          description: The contracts could not be updated; nothing was deleted, retry

  /organizations/{organizationId}/services/{serviceName}:
    get:
      summary: Get service details
      description: |
        Retrieves detailed information about a specific service in a organization.

        **Authentication**: User API Key

        **Permission**: 
        - USER user: must be an organization member with any role (OWNER/ADMIN/MANAGER/EVALUATOR)
        - ADMIN user: can view service details in any organization

      tags:
        - Services
      security:
        - ApiKeyAuth: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
        - name: serviceName
          in: path
          required: true
          schema:
            type: string
          example: Zoom
      responses:
        '200':
          description: Service details including pricings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '403':
          description: Forbidden
        '404':
          description: Service not found

    put:
      summary: Update service
      description: |
        Updates service metadata (name, organization).

        **Authentication**: User API Key

        **Permission**: 
        - USER user: OWNER/ADMIN/MANAGER role required
        - ADMIN user: can update services in any organization

        **Cascading Operations** (every contract of the organization; see "Renaming and moving services"):
        - Renaming a service renames it in `contractedServices`, `subscriptionPlans`, `subscriptionAddOns` and
          `usageLevels` of every contract that has it (`CONTRACT_NOVATED`).
        - Updating `organizationId` triggers one of the following behaviors:
            - If contracts include **only the updated service**, they move to the new organization
              (`CONTRACT_DELETED` in the organization they leave, `CONTRACT_CREATED` in the new one).
            - If contracts include **multiple contracted services**, the updated service is removed from them
              (`CONTRACT_NOVATED`; the previous subscription is recorded in their history).
        - The pricings of the service follow it.

      tags:
        - Services
      security:
        - ApiKeyAuth: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
        - name: serviceName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                organizationId:
                  type: string
                defaultVersion:
                  type: string
                  nullable: true
                  description: |
                    Manual services only: pricing version assigned to new contracts that omit one (see
                    `GET .../pricings/new-contracts`). Must be an active version; `null` removes it. It is removed
                    automatically when that version is archived. SPHERE-linked services answer `400`: their
                    synchronization policy decides.
                  example: "2025"
      responses:
        '200':
          description: Service updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '400':
          description: Invalid update data (e.g., organization not found)
        '403':
          description: Forbidden
        '404':
          description: Service not found
        '409':
          description: |
            Nothing was changed: the name is taken by another service, enabled or disabled, of the organization the
            service would be in; a contract would end up with two subscriptions under the new name; or a contract
            that would move has a `userId` the target organization already uses. Also when a contract kept changing
            while it was being updated (repeat the request).

    delete:
      summary: Disable service
      description: |
        Disables a service (reversible): its pricings are archived and `SERVICE_DISABLED` is announced. Uploading a
        pricing with the same `saasName` enables it again. Contracts are not changed: the service is dormant in them
        (its features are not available, the rest of each contract works normally) until it is enabled again; see
        "Disabling and deleting services". To delete services for good, and remove them from contracts, use
        `DELETE /services`.

        **Authentication**: User API Key

        **Permission**: 
        - USER user: OWNER/ADMIN role required
        - ADMIN user: can disable services in any organization

      tags:
        - Services
      security:
        - ApiKeyAuth: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
        - name: serviceName
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Service disabled successfully
        '403':
          description: Forbidden
        '404':
          description: Service not found

  /organizations/{organizationId}/services/{serviceName}/pricings:
    get:
      summary: List service pricings
      description: |
        Lists all pricing versions for a specific service in a organization.

        **Authentication**: User API Key

        **Permission**: 
        - USER user: organization member with any role
        - ADMIN user: can view pricings of any service in any organization

      tags:
        - Services
      security:
        - ApiKeyAuth: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
        - name: serviceName
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of pricing versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pricing'
        '403':
          description: Forbidden
        '404':
          description: Service not found

    post:
      summary: Add pricing version to service
      description: |
        Uploads and adds a new pricing version to the service.

        **Authentication**: User API Key

        **Permission**: 
        - USER user: OWNER/ADMIN/MANAGER role required
        - ADMIN user: can add pricings to any service in any organization

        **Constraints**:
        - Pricing `saasName` and `serviceName` must be the same

      tags:
        - Services
      security:
        - ApiKeyAuth: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
        - name: serviceName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - pricing
              properties:
                pricing:
                  type: string
                  format: binary
                  description: Pricing file in YAML or JSON format
      responses:
        '201':
          description: Pricing version added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pricing'
        '400':
          description: Invalid pricing data
        '403':
          description: Forbidden
        '404':
          description: Service not found

  /organizations/{organizationId}/services/{serviceName}/pricings/new-contracts:
    get:
      summary: Pricing version for new contracts
      description: |
        The pricing version SPACE assigns to new contracts of the service, which signed-out visitors of a pricing
        page should see. `POST /contracts` uses it for services it subscribes without a `contractedServices` entry.
        The service name is matched exactly (case-insensitive).

        This route takes precedence over `GET .../pricings/{pricingVersion}`: a pricing version literally named
        `new-contracts` cannot be read through that route (neither as JSON nor with `format=yaml`). Avoid that
        version name.

        **Authentication**: User API Key

        **Permission**: organization member with any role (OWNER/ADMIN/MANAGER/EVALUATOR), or ADMIN user

      tags:
        - Services
      security:
        - ApiKeyAuth: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
        - name: serviceName
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Version for new contracts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewContractsPricing'
        '404':
          description: Service not found in the organization, or it has no active version

  /organizations/{organizationId}/services/{serviceName}/pricings/{pricingVersion}/public-url:
    get:
      summary: Get the download URL of a pricing file
      description: |
        Returns the URL from which the Pricing2Yaml file of a version can be
        downloaded. Despite the name of this endpoint, that URL is **not
        public**: it is the authorised `GET /organizations/{organizationId}/services/{serviceName}/pricings/{pricingVersion}?format=yaml`
        and needs the same credentials as this request (`x-api-key`).
        Pricing files are not served as static files.

        **Authentication**: User API Key (member of the organization; same roles as the pricing route)

      tags:
        - Services
      security:
        - ApiKeyAuth: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
        - name: serviceName
          in: path
          required: true
          schema:
            type: string
        - name: pricingVersion
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Download URL of the pricing file
          content:
            application/json:
              schema:
                type: object
                properties:
                  path:
                    type: string
                    description: Relative URL of the authorised download route.
                    example: /api/v1/services/zoom/pricings/2025?format=yaml
                  url:
                    type: string
                    format: uri
                    description: Absolute URL of the authorised download route.
                  requiresAuthentication:
                    type: boolean
                    description: Always true. Send `x-api-key` when downloading.
        '404':
          description: Service or pricing version not found

  /organizations/{organizationId}/services/{serviceName}/pricings/{pricingVersion}:
    get:
      summary: Get pricing version details
      description: |
        Retrieves complete details about a specific pricing version including 
        plans, add-ons, and availability.

        **Authentication**: User API Key

        **Permission**: 
        - USER user: organization member with any role
        - ADMIN user: can view any pricing version from any service in any organization

      tags:
        - Services
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/PricingFormat'
        - $ref: '#/components/parameters/IfNoneMatchPricingYaml'
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
        - name: serviceName
          in: path
          required: true
          schema:
            type: string
        - name: pricingVersion
          in: path
          required: true
          schema:
            type: string
          example: "1.0.0"
      responses:
        '200':
          description: |
            Pricing details (JSON), or with `format=yaml` the stored Pricing2Yaml file of the version, byte for
            byte.
          headers:
            ETag:
              description: '`format=yaml` only: `"<sha256 hex of the body>"`.'
              schema:
                type: string
            X-Pricing-Syntax-Version:
              description: '`format=yaml` only: `syntaxVersion` of the file, exactly as written (an unquoted `3.0` is `3.0`). Exposed to browsers through CORS, like `ETag`.'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pricing'
            application/yaml:
              schema:
                type: string
                description: Pricing2Yaml document
        '404':
          description: |
            Pricing not found. With `format=yaml`, `{"error": "PRICING_YAML_UNAVAILABLE"}` when the version exists
            but its file cannot be provided (no stored copy and, for SPHERE-linked services, SPHERE no longer
            lists the version).
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: PRICING_YAML_UNAVAILABLE
                  message:
                    type: string
        '502':
          description: |
            `format=yaml`, SPHERE-linked services only: `{"error": "SPHERE_UNAVAILABLE"}` when a historical
            version had to be fetched from SPHERE and SPHERE could not be reached, failed, or returned content
            that does not match its manifest. Temporary; retry later.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: SPHERE_UNAVAILABLE
                  message:
                    type: string
        '304':
          description: '`format=yaml` only: the file matches `If-None-Match`.'
        '400':
          description: Invalid `format` (use `json` or `yaml`).

    put:
      summary: Update pricing availability
      description: |
        Updates the availability status of a pricing version.

        **Authentication**: User API Key

        **Permission**: 
        - USER user: OWNER/ADMIN/MANAGER role required
        - ADMIN user: can update availability of any pricing version from any service in any organization

      tags:
        - Services
      security:
        - ApiKeyAuth: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
        - name: serviceName
          in: path
          required: true
          schema:
            type: string
        - name: pricingVersion
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                available:
                  type: boolean
                  example: true
      responses:
        '200':
          description: Pricing availability updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pricing'
        '403':
          description: Forbidden
        '404':
          description: Pricing version not found

    delete:
      summary: Delete pricing version
      description: |
        Removes a pricing version from the given service in the given organization (irreversible operation).

        **Authentication**: User API Key

        **Permission**: 
        - USER user: OWNER/ADMIN role required
        - ADMIN user: can delete any pricing version from any service in any organization

      tags:
        - Services
      security:
        - ApiKeyAuth: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
        - name: serviceName
          in: path
          required: true
          schema:
            type: string
        - name: pricingVersion
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Pricing version deleted successfully
        '403':
          description: Forbidden
        '404':
          description: Pricing version not found

  /services:
    get:
      summary: List all services
      description: |
        Lists all services configured in the organization.

        **Authentication**: Organization API Key | User API Key

        **Organization API Key Permission**:
          - ALL scope: can view and filter all services from the organization
          - MANAGEMENT scope: can view and filter all services from the organization
          - EVALUATION scope: can view and filter all services from the organization

        **User API Key Permission**:
          - ADMIN user: can view all services from any organization
      tags:
        - Services
      security:
        - ApiKeyAuth: []
      parameters:
        - in: query
          name: disabled
