  /organizations/{organizationId}/contracts/{userId}/novation/preview:
    post:
      summary: Preview a novation (dry run)
      description: |
        Runs exactly what `PUT /contracts/{userId}` would run with the same body and options - resolution of the
        pricing versions (omitted services keep the contract's version or get the version for new contracts),
        SPHERE policies, subscription validation (with the codes of `InvalidSubscription`) and the billing period
        (`keepBillingPeriod`) - and writes nothing. An invalid configuration still answers `200`, with
        `valid: false` and `errors`. Limits below the current consumption are reported as `usageWarnings` (they do
        not make the novation invalid). Feature/limit diffs and prices are not computed by SPACE.

        Send `contractVersion` back in `If-Match` when applying the change.

        **Authentication**: User API Key

        **Permission**: organization member with role OWNER, ADMIN or MANAGER, or ADMIN user (as for the novation)

      tags:
        - Contracts
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/KeepBillingPeriod'
        - $ref: '#/components/parameters/RejectPrivate'
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        $ref: '#/components/requestBodies/SubscriptionCompositionNovation'
      responses:
        '200':
          description: What the novation would do
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NovationPreview'
        '404':
          $ref: '#/components/responses/ContractNotFound'
        '409':
          description: A SPHERE synchronization is being applied; retry shortly
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

