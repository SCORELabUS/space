        Organization scoping as for `GET /contracts/{userId}`.

        **Authentication**: User API Key

        **Permission**: organization member with any role (OWNER/ADMIN/MANAGER/EVALUATOR), or ADMIN user

      tags:
        - Contracts
      security:
        - ApiKeyAuth: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Pricing versions of the contract
          headers:
            ETag:
              $ref: '#/components/headers/ContractETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractPricings'
        '404':
          $ref: '#/components/responses/ContractNotFound'

  /contracts:
    get:
      summary: List all contracts
      description: |
        Lists all contracts with optional filtering and pagination.

        **Authentication**: User API Key (ADMIN) | Organization API Key

        **User Permission**: 
        - ADMIN user: can view all contracts from any organization (without organizationId filter)

        **Organization Permission**:
        - ALL scope: can view all contracts from the organization
        - MANAGEMENT scope: can view all contracts from the organization

        **Request Filters**:
        - Query parameters (`/contracts?username=john&limit=50`): Basic filters with pagination
        - Request body (`POST` with filters object): Complex/advanced filtering via JSON body
        - Combined: Both query and body filters are merged (body filters override query filters)

        **Response Format**:
        - Plain array of Contract objects (not paginated wrapper)
        - Total count provided via `X-Total-Count` response header

      tags:
        - Contracts
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/ContractOrganizationId'
        - name: username
          in: query
          required: false
          schema:
            type: string
          description: Filter contracts by username (case-insensitive regex match)
          example: john_doe
        - name: firstName
          in: query
          required: false
          schema:
            type: string
          description: Filter contracts by user's first name (case-insensitive regex match)
          example: John
        - name: lastName
          in: query
          required: false
          schema:
            type: string
          description: Filter contracts by user's last name (case-insensitive regex match)
          example: Doe
        - name: email
          in: query
          required: false
          schema:
            type: string
          description: Filter contracts by user email (case-insensitive regex match)
          example: john@example.com
        - name: groupId
          in: query
          required: false
          schema:
            type: string
          description: Filter contracts by group ID
          example: my-group
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
          description: |
            Page number for pagination (1-based). 
            **Note**: Ignored when `offset > 0`.
          example: 1
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
          description: |
            Number of contracts to skip (0-based offset). 
            **Precedence**: When `offset > 0`, it overrides the `page` parameter.
          example: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
          description: Maximum number of contracts to return per page
          example: 20
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [firstName, lastName, username, email]
          description: Field to sort contracts by
          example: firstName
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: asc
          description: Sort order (ascending or descending)
          example: asc
      responses:
        '200':
          description: List of contracts (plain array with total count in header)
          headers:
            X-Total-Count:
              schema:
                type: integer
              description: Total number of contracts matching the filters
              example: 42
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Contract'
              examples:
                withFilters:
                  summary: Contracts filtered by username and sorted by firstName
                  value:
                    - id: 507f1f77bcf86cd799439011
                      userId: user123
                      organizationId: org456
                      userContact:
                        username: john_doe
                        firstName: John
                        lastName: Doe
                        email: john@example.com
                      billingPeriod:
                        startDate: "2024-01-01"
                        endDate: "2024-12-31"
                      contractedServices: []
                      subscriptionPlans: []
                      subscriptionAddons: []
                      subscriptionSnapshot: {}
                      usageLevels: []
                    - id: 507f1f77bcf86cd799439012
                      userId: user124
                      organizationId: org456
                      userContact:
                        username: johnny_test
                        firstName: Johnny
                        lastName: Test
                        email: johnny@example.com
                      billingPeriod:
                        startDate: "2024-01-01"
                        endDate: "2024-12-31"
                      contractedServices: []
                      subscriptionPlans: []
                      subscriptionAddons: []
                      subscriptionSnapshot: {}
                      usageLevels: []
        '400':
          description: Invalid query parameters or request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - missing or invalid API key
        '403':
          description: Forbidden - insufficient permissions

    post:
