              required:
                - pricing
              properties:
                name:
                  type: string
                description:
                  type: string
                pricing:
                  type: string
                  format: binary
      responses:
        '201':
          description: Service created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '403':
          description: Forbidden

    delete:
      summary: Delete all services
      description: |
        Deletes all services (enabled and disabled) and associated pricings in the organization (irreversible
        operation), after removing them from every contract of the organization (see "Disabling and deleting
        services").

        **Authentication**: Organization API Key | User API Key

        **Organization Permission**:
          - ALL scope: delete all services from the organization.

        **User Permission**:
          - ADMIN user: can delete all services allocated in a SPACE instance.
      tags:
        - Services
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: All services deleted (`{ message }`)
        '403':
          description: Forbidden
        '409':
          description: A contract kept changing while the services were removed from it; nothing was deleted, retry
        '500':
          description: The contracts could not be updated; nothing was deleted, retry

  /services/{serviceName}:
    get:
      summary: Get service
      description: |
        Retrieves detailed information about a specific service in a organization.

        **Authentication**: Organization API Key

        **Permission**: Org Key with any scope

      tags:
        - Services
      security:
        - ApiKeyAuth: []
      parameters:
        - name: serviceName
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Service details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '404':
          description: Service not found

    put:
      summary: Update service
      description: |
        Updates service metadata (name, organization).

        **Authentication**: Organization API Key

        **Permission**: 
          - ALL scope: can update service name and organization.
          - MANAGEMENT scope: can update service name and organization

        **Cascading Operations** (every contract of the organization; see "Renaming and moving services"):
        - Renaming a service renames it in `contractedServices`, `subscriptionPlans`, `subscriptionAddOns` and
          `usageLevels` of every contract that has it (`CONTRACT_NOVATED`).
        - Updating `organizationId` triggers one of the following behaviors:
            - If contracts include **only the updated service**, they move to the new organization
              (`CONTRACT_DELETED` in the organization they leave, `CONTRACT_CREATED` in the new one).
            - If contracts include **multiple contracted services**, the updated service is removed from them
              (`CONTRACT_NOVATED`; the previous subscription is recorded in their history).
        - The pricings of the service follow it.

      tags:
        - Services
      security:
        - ApiKeyAuth: []
      parameters:
        - name: serviceName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                organizationId:
                  type: string
                defaultVersion:
                  type: string
                  nullable: true
                  description: |
                    Manual services only: pricing version assigned to new contracts that omit one (see
                    `GET .../pricings/new-contracts`). Must be an active version; `null` removes it. It is removed
                    automatically when that version is archived. SPHERE-linked services answer `400`: their
                    synchronization policy decides.
                  example: "2025"
      responses:
        '200':
          description: Service updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '400':
          description: Invalid update data (e.g., organization not found)
        '403':
          description: Forbidden
        '404':
          description: Service not found
        '409':
          description: |
            Nothing was changed: the name is taken by another service, enabled or disabled, of the organization the
            service would be in; a contract would end up with two subscriptions under the new name; or a contract
            that would move has a `userId` the target organization already uses. Also when a contract kept changing
            while it was being updated (repeat the request).

    delete:
      summary: Disable service
      description: |
        Disables a service (reversible): its pricings are archived and `SERVICE_DISABLED` is announced. Uploading a
        pricing with the same `saasName` enables it again. Contracts are not changed: the service is dormant in them
        (its features are not available, the rest of each contract works normally) until it is enabled again; see
        "Disabling and deleting services". To delete services for good, and remove them from contracts, use
        `DELETE /services`.

        **Authentication**: Organization API Key

        **Permission**:
          - ALL scope: can disable any service from the organization.

      tags:
        - Services
      security:
        - ApiKeyAuth: []
      parameters:
        - name: serviceName
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Service disabled
        '403':
          description: Forbidden

  /services/{serviceName}/pricings:
