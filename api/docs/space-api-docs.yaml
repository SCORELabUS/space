  /features/{userId}/pricing-token:
    post:
      summary: Generate pricing token
      description: |
        Generates a JWT token containing the user's pricing and subscription information 
        for use by client-side feature evaluation.

        Payload (`PricingTokenPayload`): `sub` (`urn:space:<organizationId>:<percent-encoded userId>`), `userId`, `organizationId`, `aud`
        (the organization), `iss` (this SPACE server), `iat`, `exp`, `features`, `pricingContext`,
        `subscriptionContext` and, optionally, `subscription` - the subscription the token was computed from, with
        the `contractVersion` of the contract. A `userId` is only unique within an organization, so `sub` names
        both. Verifiers should check `iss` and `aud` and read the user from `userId`; clients must not parse
        `sub`. Clients must ignore claims
        they do not know; `subscription`, `userId`, `organizationId`, `aud` and `iss` are absent, and `sub` is
        the bare `userId`, in tokens issued by older SPACE versions.

        **Authentication**: Organization API Key only

        **Permission**: Org Key with any scope

      tags:
        - Features
      security:
        - ApiKeyAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: server
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Perform evaluation using server-side context instead of token-based evaluation
      responses:
        '200':
          description: Pricing token generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  pricingToken:
                    type: string
                    description: JWT (HS256) whose payload is a `PricingTokenPayload`
        '404':
          $ref: '#/components/responses/ContractNotFound'

  /features/{userId}/{featureId}:
    post:
      summary: Evaluate single feature
      description: |
        Evaluates a specific feature for a user with expected consumption, returning 
        whether the feature is allowed and any usage warnings.

        **Authentication**: Organization API Key only

        **Permission**: Org Key with any scope (ALL/MANAGEMENT/EVALUATION). Recording the expected
        consumption and reverting it (`?revert=true`) are part of the evaluation and allowed for every
        scope; setting or resetting usage levels directly (`PUT /contracts/{userId}/usageLevels`)
        requires ALL or MANAGEMENT.

      tags:
        - Features
      security:
        - ApiKeyAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: featureId
          in: path
          required: true
          schema:
            type: string
        - name: server
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Perform evaluation using server-side context instead of token-based evaluation
        - name: revert
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Reset feature usage levels after evaluation
        - name: latest
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Use the latest feature configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expectedConsumption:
                  type: number
                  example: 1.5
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  allowed:
                    type: boolean
                  reason:
                    type: string
          description: |
            Feature evaluation result. A feature of a service that is disabled (dormant in the contract) answers
            `{ eval: false, limit: null, used: null, error: { code: SERVICE_DISABLED, message } }` (or
            `SERVICE_NOT_FOUND` when the organization no longer has the service), like `FLAG_NOT_FOUND` for an
            unknown feature, and nothing is consumed.
        '404':
          $ref: '#/components/responses/ContractNotFound'
        '409':
          $ref: '#/components/responses/DormantService'

  /analytics/api-calls:
    get:
      summary: Get API call statistics
      description: |
        Retrieves statistics about API call usage in the system.

        **Authentication**: User API Key (ADMIN, USER) | Organization API Key

        **User Permission**:
          - USER user: can view API call statistics
          - ADMIN user: can view API call statistics

        **Organization Permission**:
          - ALL scope: can view API call statistics
          - MANAGEMENT scope: can view API call statistics
          - EVALUATION scope: can view API call statistics

      tags:
        - Analytics
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: API call statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  byEndpoint:
                    type: object

  /analytics/evaluations:
    get:
      summary: Get feature evaluation statistics
      description: |
        Retrieves statistics about feature evaluations performed by the system.

        **Authentication**: User API Key (ADMIN, USER) | Organization API Key

        **User Permission**:
          - USER user: can view feature evaluation statistics
          - ADMIN user: can view feature evaluation statistics

        **Organization Permission**:
          - ALL scope: can view feature evaluation statistics
          - MANAGEMENT scope: can view feature evaluation statistics
          - EVALUATION scope: can view feature evaluation statistics

      tags:
        - Analytics
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Evaluation statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalEvaluations:
                    type: integer
                  byFeature:
                    type: object

  /cache/get:
    get:
      summary: Get cached value
      description: |
        Retrieves a value from the system cache by key.

        **Authentication**: User API Key (ADMIN only)

        **Permission**: ADMIN role required

      tags:
        - Cache
      security:
        - ApiKeyAuth: []
      parameters:
        - name: key
          in: query
          required: true
          schema:
            type: string
          example: pricing_cache_zoom
      responses:
        '200':
          description: Cached value retrieved
          content:
            application/json:
              schema:
                type: object

  /cache/set:
    post:
      summary: Set cache value
      description: |
        Stores a value in the system cache with the specified key.

        **Authentication**: User API Key (ADMIN only)

        **Permission**: ADMIN role required

      tags:
        - Cache
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - key
                - value
              properties:
                key:
                  type: string
                  example: pricing_cache_zoom
                value:
                  type: object
      responses:
        '200':
          description: Value cached successfully
          content:
            application/json:
              schema:
                type: object

  /events/status:
    get:
      summary: Get event service status
      description: |
        Checks if the WebSocket event service is running and operational. See the `Events` tag for the Socket.IO
        namespaces (`/pricings`, `/contracts`) and their messages.

        **Authentication**: Public (no API key required)

      tags:
        - Events
      responses:
        '200':
          description: Service status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: The WebSocket event service is active

  /events/test-event:
    post:
      summary: Send test event (for testing)
      description: |
        Sends a test `PRICING_ARCHIVED` event to every client of the `/pricings` namespace (used for testing
        purposes). Disabled (`404`) when `ENVIRONMENT=production` unless `ENABLE_TEST_EVENTS=true`.

        **Authentication**: Organization API Key with scope ALL | User API Key (ADMIN)

      tags:
        - Events
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - serviceName
                - pricingVersion
              properties:
                serviceName:
                  type: string
                  example: Zoom
                pricingVersion:
                  type: string
                  example: "1.0"
      responses:
        '200':
          description: Event sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '400':
          description: serviceName and pricingVersion are required
        '401':
          description: API key missing
        '403':
          description: Not an organization key with scope ALL nor an ADMIN user
        '404':
          description: Disabled in production

  /events/client:
    get:
      summary: Get WebSocket client HTML
      description: |
        Returns an HTML file for testing WebSocket connections to the event service.

        **Authentication**: Public

      tags:
        - Events
      responses:
        '200':
          description: WebSocket client HTML
          content:
            text/html:
              schema:
                type: string

  /healthcheck:
    get:
      summary: Service health check
      description: |
        Verifies that the SPACE API service is operational and responsive. 
        Use this endpoint for load balancer health checks.

        **Authentication**: Public (no API key required)

      tags:
        - Healthcheck
      responses:
        '200':
          description: Service is operational
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Service is up and running!

components:
  schemas:
    SphereVersion:
      type: object
      required: [versionId, version, createdAt, contentHash]
      properties:
        versionId: { type: string, pattern: '^[a-f0-9]{24}$' }
        version: { type: string }
        createdAt: { type: string, format: date-time }
        contentHash: { type: string, description: SHA-256 of canonical functional pricing content }
        private:
          type: boolean
          description: Present only for callers whose SPHERE API key may read the pricing; `true` for a private version.
    SphereConfiguration:
      type: object
      required: [permanentUrl, policy]
      properties:
        permanentUrl: { type: string, format: uri }
        policy:
          type: string
          enum: [all_last, new_last, all_pick, new_pick]
          description: All migrates current bindings with cheapest-valid-plan fallback. New preserves them. Last orders public versions by pricing date. Pick requires selectedVersionId.
        selectedVersionId:
          type: string
          description: Required for all_pick and new_pick; immutable public SPHERE version ID.
        acceptedSyntaxUpgradeVersionId:
          type: string
          description: Required only when preview reports a syntax upgrade; must equal that inspected public version ID.
        pollIntervalMinutes:
          type: integer
          enum: [1, 5, 15]
          default: 5
          description: How often SPACE checks SPHERE for a newer public version for this linked service.
        sphereApiKey:
          type: string
          nullable: true
          writeOnly: true
          description: >-
            Optional SPHERE API key (`sk-...`). SPACE sends it as `x-api-key` on every SPHERE request of this service,
            so that private versions the key may read are listed and imported. Use a MANAGEMENT or ALL key of the organisation
            that owns the pricing; a VIEW key only reveals what its user may read. Write-only: stored encrypted
            (AES-256-GCM with the key in `SPHERE_KEY_ENCRYPTION_KEY`, bound to the service, its SPHERE pricing and the
            SPHERE API origin) and never returned; if the SPHERE origin changes, SPACE does not send it there and the
            service reports `degraded` until the key is entered again. Rotate the encryption key with
            `SPHERE_KEY_ENCRYPTION_KEY_PREVIOUS`. Rejected with 400 when `SPHERE_KEY_ENCRYPTION_KEY` is not set.
            Private versions are stored outside the statically served files: they are only available through
            `GET .../pricings/{version}?format=yaml` (authorised) and have no public URL (`.../public-url` answers
            `404`).
    SphereCreateService:
      allOf:
        - $ref: '#/components/schemas/SphereConfiguration'
        - type: object
          required: [source]
          properties:
            source: { type: string, enum: [sphere] }
    SphereManifest:
      type: object
      required: [pricingId, name, permanentUrl, latestVersionId, versions]
      properties:
        pricingId: { type: string }
        name: { type: string }
        permanentUrl: { type: string, format: uri }
        latestVersionId: { type: string }
        versions:
          type: array
          items: { $ref: '#/components/schemas/SphereVersion' }
        syntaxUpgrade:
          type: object
          nullable: true
          description: The selected source version requires explicit confirmation before SPACE stores its upgraded YAML snapshot.
          properties:
            versionId: { type: string }
            from: { type: string }
            to: { type: string }
    SphereSyncState:
      type: object
      properties:
        source: { type: string, enum: [manual, sphere] }
        disabled: { type: boolean, description: Whether the service is paused; existing contracts and retained snapshots are preserved. }
        configuration:
          allOf:
            - $ref: '#/components/schemas/SphereConfiguration'
            - type: object
              properties:
                target: { $ref: '#/components/schemas/SphereVersion' }
                hasApiKey: { type: boolean, description: Whether a SPHERE API key is stored for this service. }
                revision: { type: integer }
                status: { type: string, enum: [ready, queued, checking, applying, blocked, degraded] }
                error: { type: string, nullable: true }
                lastCheckedAt: { type: string, format: date-time }
                lastSyncedAt: { type: string, format: date-time }
                migrated: { type: integer }
                replaced: { type: integer }
        retainedVersions:
          type: array
          items:
            type: object
            properties:
              version: { type: string }
        run:
          type: object
          nullable: true
          description: Persistent execution including ID, candidate, status, migrated/replaced counts and recoverable error.
    Username:
      type: string
      description: Username of the user
      example: johndoe
      minLength: 3
      maxLength: 30

    Password:
      type: string
      description: Password of the user
      example: j0hnD03
      minLength: 5

    Role:
      type: string
      description: Role of the user
      enum: [ADMIN, USER]
      example: USER

    ApiKey:
      type: string
      description: Random 32 byte string encoded in hexadecimal
      example: usr_9cedd24632167a021667df44a26362dfb778c1566c3d4564e132cb58770d8c67
      pattern: '^usr_[a-f0-9]{64}$'
      readOnly: true

    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    FieldValidationError:
      type: object
      properties:
        type:
          type: string
          example: field
        msg:
          type: string
          example: Password must be a string
        path:
          type: string
          example: password
        location:
          type: string
          example: body
        value:
          example: invalid
      required:
        - type
        - msg
        - path
        - location

    UserInput:
      type: object
      properties:
        username:
          $ref: '#/components/schemas/Username'
        password:
          $ref: '#/components/schemas/Password'
        role:
          $ref: '#/components/schemas/Role'
      required:
        - username
        - password

    UserUpdate:
      type: object
      properties:
        username:
          $ref: '#/components/schemas/Username'
        password:
          $ref: '#/components/schemas/Password'
        role:
          $ref: '#/components/schemas/Role'
    User:
      type: object
      properties:
        username:
          $ref: '#/components/schemas/Username'
        apiKey:
          $ref: '#/components/schemas/ApiKey'
        role:
          $ref: '#/components/schemas/Role'
        createdAt:
          type: string
          format: date-time

    Organization:
      type: object
      properties:
        id:
          type: string
          example: 507f1f77bcf86cd799439012
        name:
          type: string
          example: ACME Corporation
        owner:
          type: string
          example: john_doe
        default:
          type: boolean
          example: false
        members:
          type: array
          items:
            type: object
            properties:
              username:
                type: string
              role:
                type: string
                enum: [OWNER, ADMIN, MANAGER, EVALUATOR]
        apiKeys:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              scope:
                type: string
                enum: [ALL, MANAGEMENT, EVALUATION]
        createdAt:
          type: string
          format: date-time

    Service:
      type: object
      properties:
        name:
          type: string
          example: Zoom
        description:
          type: string
          example: Video conferencing platform
        organization:
          type: string
        available:
          type: boolean
        pricings:
          type: array
          items:
            $ref: '#/components/schemas/Pricing'
        createdAt:
          type: string
          format: date-time
        defaultVersion:
          type: string
          description: Manual services only, optional. Version for new contracts (see `NewContractsPricing`).
        source:
          type: string
          enum: [manual, sphere]
        sphere:
          type: object
          description: SPHERE binding of a linked service (see `SphereSyncState.configuration`); the API key is never included.
          properties:
            pricingId: { type: string }
            permanentUrl: { type: string, format: uri }
            policy: { type: string, enum: [all_last, new_last, all_pick, new_pick] }
            target: { $ref: '#/components/schemas/SphereVersion' }
            status: { type: string, enum: [ready, queued, checking, applying, blocked, degraded] }
            hasApiKey: { type: boolean, description: Whether a SPHERE API key is stored for this service. }

    NewContractsPricing:
      type: object
      required: [version, yamlUrl, source]
      properties:
        version:
          type: string
          description: Pricing version SPACE assigns to new contracts of the service (unescaped).
          example: "2025-01-10"
        yamlUrl:
          type: string
          description: Path of its Pricing2Yaml file (`format=yaml`), on the same kind of route as the request.
          example: /api/v1/services/acme/pricings/2025-01-10?format=yaml
        source:
          type: string
          enum: [sphere-policy, default, latest-active]
          description: |
            `sphere-policy`: target of the SPHERE synchronization policy (linked services). `default`: the service's
            `defaultVersion`. `latest-active`: fallback, the most recently created (`createdAt`) active version;
            versions without a known creation date (remote URL pricings) come last, and versions created at the
            same time are ordered by version, descending (numeric-aware), so the answer is deterministic.

    Pricing:
      type: object
      properties:
        version:
          type: string
          example: "1.0.0"
        yamlPath:
          type: string
          description: |
            Storage reference of the stored Pricing2Yaml file
            (`/private/pricings/...` for uploaded pricings,
            `/private/sphere/...` for SPHERE snapshots). It is **not a URL**:
            download the file with `GET .../pricings/{pricingVersion}?format=yaml`
            and the credentials of the owning organization. Versions before this
            change returned a `/static/pricings/...` path that was served
            without authentication; such paths now answer 404.
          example: /private/pricings/63f74bf8eeed64058364b52e-zoom-2025.yaml
        sphere:
          type: object
          readOnly: true
          description: |
            Present only on snapshots imported from SPHERE (services with
            `source: sphere`): the SPHERE pricing and version this pricing copies.
            Clients can open the pricing in SPHERE through `permanentUrl`
            (`/p/{pricingId}`), where SPHERE applies its own permissions.
          properties:
            serviceId:
              type: string
            pricingId:
              type: string
              pattern: '^[a-f0-9]{24}$'
            versionId:
              type: string
              pattern: '^[a-f0-9]{24}$'
            permanentUrl:
              type: string
              format: uri
              example: https://sphere.score.us.es/p/65f0c1a2b3c4d5e6f7a8b9c0
            version:
              type: string
            createdAt:
              type: string
              format: date-time
            contentHash:
              type: string
        service:
          type: string
        available:
          type: boolean
        plans:
          type: array
          items:
            type: object
        addOns:
          type: array
          items:
            type: object
        createdAt:
          type: string
          format: date-time

    Contract:
      type: object
      description: |
        Contract representation compatible with iSubscription.
      required:
        - billingPeriod
        - organizationId
        - usageLevels
        - contractedServices
        - subscriptionPlans
        - history
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        organizationId:
          type: string
          description: Organization identifier owning the contract
          example: 507f1f77bcf86cd799439012
        userContact:
          $ref: '#/components/schemas/UserContact'
        billingPeriod:
          $ref: '#/components/schemas/BillingPeriod'
        usageLevels:
          $ref: '#/components/schemas/UsageLevels'
        contractedServices:
          $ref: '#/components/schemas/ContractedService'
        subscriptionPlans:
          $ref: '#/components/schemas/SubscriptionPlans'
        subscriptionAddOns:
          $ref: '#/components/schemas/SubscriptionAddons'
        history:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionSnapshot'
        contractVersion:
          $ref: '#/components/schemas/ContractVersion'

    ContractEvent:
      type: object
      description: Socket.IO `message` event of the `/contracts` namespace (not an HTTP response).
      required: [code, details]
      properties:
        code:
          type: string
          enum: [CONTRACT_CREATED, CONTRACT_NOVATED, CONTRACT_DELETED, CONTRACT_RENEWED]
        details:
          type: object
          required: [userId, organizationId, contractVersion, services]
          properties:
            userId:
              type: string
            organizationId:
              type: string
            contractVersion:
              type: string
              nullable: true
              description: Version after the change; `null` for `CONTRACT_DELETED`.
            services:
              type: array
              items:
                type: string
      example:
        code: CONTRACT_NOVATED
        details:
          userId: 01c36d29-0d6a-4b41-83e9-8c6d9310c508
          organizationId: 507f1f77bcf86cd799439012
          contractVersion: 4-2c26b46b68ffc68f
          services: [acme]

    PricingTokenPayload:
      type: object
      description: |
        Payload of the pricing token (JWT claims besides `iat` and `exp`). A `userId` is only unique within an
        organization, so the registered claims name both (RFC 7519 §4.1, RFC 8725 §3.9). In tokens of SPACE
        versions without `contract-userid-per-org`, `sub` is the bare `userId` and `userId`, `organizationId`,
        `aud` and `iss` are absent.
      required: [sub, userId, organizationId, aud, iss, features, pricingContext, subscriptionContext]
      properties:
        sub:
          type: string
          description: |
            The URN `urn:space:<organizationId>:<encodeURIComponent(userId)>` (RFC 7519 §2: a `StringOrURI`
            containing `:` is a URI), unique within the issuer: the organization id is 24 hex characters and the
            percent-encoded `userId` contains no `:`, `/` or space. An opaque identifier: clients must not parse
            it and read the `userId` and `organizationId` claims instead.
          example: 'urn:space:65f1c0ffee0000000000000a:42'
        userId:
          type: string
          description: userId of the contract, as stored (unique within its organization)
          example: '42'
        organizationId:
          type: string
          description: Organization of the contract
          example: 65f1c0ffee0000000000000a
        aud:
          type: string
          description: The organization of the contract (same as `organizationId`). A verifier checks it against the organization it serves.
          example: 65f1c0ffee0000000000000a
        iss:
          type: string
          description: The SPACE server that issued the token (`JWT_ISSUER`, default `space`).
          example: space
        features:
          type: object
          description: Detailed evaluation of every feature (`{ eval, used, limit, error }` by `service-feature`)
        pricingContext:
          type: object
        subscriptionContext:
          type: object
        subscription:
          $ref: '#/components/schemas/PricingTokenSubscription'
        dormantServices:
          type: array
          items:
            type: string
          description: |
            Services of `subscription` that are disabled (or no longer exist) in the organization: their features
            are not in `features`. Only present when there are any (`service-disable-dormant`).

    PricingTokenSubscription:
      type: object
      description: |
        Optional claim. The subscription the token was computed from: the same contract the `features` of the
        token were evaluated on.

        A token is a snapshot. SPACE drops its cached token when the contract changes, but a token already
        issued keeps this subscription until it expires (`JWT_EXPIRATION`). Treat `contractVersion` here as
        advisory: a novation sent with it as `If-Match` may answer `412 CONTRACT_CHANGED`, after which the
        caller reads the contract (or a new token) again.
      required: [contractedServices, subscriptionPlans, subscriptionAddOns, contractVersion]
      properties:
        contractedServices:
          $ref: '#/components/schemas/ContractedService'
        subscriptionPlans:
          $ref: '#/components/schemas/SubscriptionPlans'
        subscriptionAddOns:
          $ref: '#/components/schemas/SubscriptionAddons'
        contractVersion:
          $ref: '#/components/schemas/ContractVersion'
      example:
        contractedServices:
          acme: "2024-06-08"
        subscriptionPlans:
          acme: growth
        subscriptionAddOns:
          acme:
            extraStorage: 2
        contractVersion: 3-9f86d081884c7d65

    NovationPreview:
      type: object
      required: [valid, errors, effective, versionChanges, usageWarnings, billingPeriod, contractVersion, dormantServices]
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionError'
        effective:
          type: object
          description: The subscription the novation would store (service keys lowercase, versions unescaped).
          properties:
            contractedServices:
              $ref: '#/components/schemas/ContractedService'
            subscriptionPlans:
              $ref: '#/components/schemas/SubscriptionPlans'
            subscriptionAddOns:
              $ref: '#/components/schemas/SubscriptionAddons'
        versionChanges:
          type: object
          description: |
            Services whose pricing version would change. `reason`: `requested` (from `contractedServices`),
            `new-contracts-version` (a service the contract did not have, without an explicit version) or
            `policy:<all_last|new_last|all_pick|new_pick>` (decided by the SPHERE synchronization policy).
          additionalProperties:
            type: object
            required: [from, to, reason]
            properties:
              from:
                type: string
                nullable: true
              to:
                type: string
              reason:
                type: string
        usageWarnings:
          type: array
          items:
            type: object
            required: [service, usageLimit, consumed, newLimit]
            properties:
              service:
                type: string
              usageLimit:
                type: string
              consumed:
                type: number
              newLimit:
                type: number
                description: Plan value, overridden by add-on usageLimits, plus usageLimitsExtensions x quantity.
        billingPeriod:
          type: object
          required: [startDate, endDate, restarts]
          properties:
            startDate:
              type: string
              format: date-time
            endDate:
              type: string
              format: date-time
            restarts:
              type: boolean
              description: '`false` with `keepBillingPeriod`.'
        contractVersion:
          $ref: '#/components/schemas/ContractVersion'
        dormantServices:
          type: array
          items:
            type: string
          description: |
            Services of `effective` that are disabled: kept exactly as the contract has them, their features stay
            unavailable until they are enabled again (`service-disable-dormant`).
      example:
        valid: false
        errors:
          - code: ADDON_NOT_AVAILABLE
            service: acme
            path: subscriptionAddOns.acme.extraStorage
            message: Add-on extraStorage is not available for plan starter in the request organization
        effective:
          contractedServices:
            acme: "2025-01-10"
          subscriptionPlans:
            acme: starter
          subscriptionAddOns:
            acme:
              extraStorage: 2
        versionChanges:
          acme:
            from: "2024-06-08"
            to: "2025-01-10"
            reason: policy:all_last
        usageWarnings:
          - service: acme
            usageLimit: storage
            consumed: 42
            newLimit: 10
        billingPeriod:
          startDate: "2026-10-27T10:00:00.000Z"
          endDate: "2026-11-26T10:00:00.000Z"
          restarts: true
        contractVersion: 3-9f86d081884c7d65
        dormantServices: []

    ContractPricings:
      type: object
      required: [services, contractVersion]
      properties:
        services:
          type: object
          description: Keyed by contracted service name (lowercase, as in `contractedServices`).
          additionalProperties:
            $ref: '#/components/schemas/ContractServicePricing'
        contractVersion:
          $ref: '#/components/schemas/ContractVersion'
      example:
        services:
          acme:
            version: "2024-06-08"
            status: archived
            yamlUrl: /api/v1/services/acme/pricings/2024-06-08?format=yaml
            newContractsVersion: "2025-01-10"
            plan: growth
            addOns:
              extraStorage: 2
            serviceStatus: enabled
        contractVersion: 3-9f86d081884c7d65

    ContractServicePricing:
      type: object
      required: [version, status, yamlUrl, newContractsVersion, addOns, serviceStatus]
      properties:
        version:
          type: string
          description: '`contractedServices[service]`, unescaped.'
        status:
          type: string
          enum: [active, archived]
          description: |
            `archived` also covers versions no longer listed by the service (e.g. SPHERE history) and services
            that no longer exist in the organization (deleted or disabled); for those, `yamlUrl` answers `404`
            and `newContractsVersion` is `null`.
        yamlUrl:
          type: string
          description: Path of its Pricing2Yaml file (`format=yaml`), on the same kind of route as the request.
        newContractsVersion:
          type: string
          nullable: true
          description: |
            Version new contracts of the service get; `null` if there is none (unknown service, no active
            version). Other failures answer `500` instead of `null`.
        plan:
          type: string
          description: '`subscriptionPlans[service]`, when the service has plans.'
        addOns:
          type: object
          description: '`subscriptionAddOns[service]` (empty object when none).'
          additionalProperties:
            type: integer
        serviceStatus:
          type: string
          enum: [enabled, disabled, not-found]
          description: |
            The service itself: `disabled` while it is disabled (dormant in the contract: its features are not
            available until a pricing with its saasName is uploaded again), `not-found` when the organization no
            longer has it (`service-disable-dormant`).

    ContractVersion:
      type: string
      readOnly: true
      description: |
        Opaque version of the contract for optimistic concurrency. It changes with every change of the
        subscription (contracted pricing versions, plans, add-ons), of the billing period, and with every
        novation or SPHERE migration, also when a novation returns to an earlier subscription. Recording usage
        does not change it. Novations write only their subscription, billing period and history fields,
        preserving concurrent consumption and contact changes with or without a precondition. Group novations
        never recreate a contract deleted during the operation. Treat the version as an opaque string: compare it for equality and send it back in
        `If-Match` (or `expectedContractVersion`). Single-contract responses also carry it as
        `ETag: "<contractVersion>"`, which CORS exposes to browser clients.
      example: 3-9f86d081884c7d65

    SubscriptionErrorCode:
      type: string
      description: |
        Stable code of a subscription validation problem:
        - `PLAN_NOT_FOUND`: the plan does not exist in the pricing version. Also reported, with the path
          `subscriptionPlans.<service>`, when the service has neither a plan nor add-ons selected.
        - `ADDON_NOT_FOUND`: the add-on does not exist in the pricing version (names are case-sensitive).
        - `ADDON_NOT_AVAILABLE`: the add-on is not available for the selected plan.
        - `ADDON_DEPENDENCY_MISSING`: an add-on it depends on is not selected.
        - `ADDON_EXCLUDED`: it cannot be combined with another selected add-on.
        - `QUANTITY_OUT_OF_RANGE`: the quantity violates min/max/step.
        - `VERSION_NOT_FOUND`: the service or its pricing version does not exist in the organization.
        - `VERSION_ARCHIVED`: the version is archived; new contracts and version changes cannot use it (a
          contract keeps an archived version it already has).
        - `PRIVATE_PLAN` / `PRIVATE_ADDON`: private, and the contract does not already have it. Only reported
          when the request opts in with `rejectPrivate`.
        Limits below the current consumption are not an error.
      enum:
        - PLAN_NOT_FOUND
        - ADDON_NOT_FOUND
        - ADDON_NOT_AVAILABLE
        - ADDON_DEPENDENCY_MISSING
        - ADDON_EXCLUDED
        - QUANTITY_OUT_OF_RANGE
        - VERSION_NOT_FOUND
        - VERSION_ARCHIVED
        - PRIVATE_PLAN
        - PRIVATE_ADDON

    SubscriptionError:
      type: object
      required: [code, service, path, message]
      properties:
        code:
          $ref: '#/components/schemas/SubscriptionErrorCode'
        service:
          type: string
          example: petclinic
        path:
          type: string
          description: Location of the offending value in the request body.
          example: subscriptionAddOns.petclinic.extraVisits
        message:
          type: string
          description: Human-readable; may change between releases (switch on `code`).

    OrganizationIdRequiredError:
      type: object
      required: [error, code]
      properties:
        error:
          type: string
          example: 'ORGANIZATION ID REQUIRED: a userId is only unique within an organization, so platform ADMIN users must name the organization on this route. Pass the organizationId query parameter (?organizationId=<id>) or use /organizations/{organizationId}/contracts/42'
        code:
          type: string
          enum: [ORGANIZATION_ID_REQUIRED]
    InvalidSubscription:
      type: object
      required: [error, errors]
      properties:
        error:
          type: string
          description: '`Invalid subscription: ` followed by the first message.'
        errors:
          type: array
          description: Every problem found.
          items:
            $ref: '#/components/schemas/SubscriptionError'
      example:
        error: 'Invalid subscription: Add-on extraVisits quantity 4 is not valid. It must be between 3 and Infinity, and a multiple of 3 in the request organization'
        errors:
          - code: QUANTITY_OUT_OF_RANGE
            service: petclinic
            path: subscriptionAddOns.petclinic.extraVisits
            message: Add-on extraVisits quantity 4 is not valid. It must be between 3 and Infinity, and a multiple of 3 in the request organization

    ContractChanged:
      type: object
      description: The novation was conditional on a contract version that is no longer current. Nothing was written.
      required:
        - error
      properties:
        error:
          type: string
          enum: [CONTRACT_CHANGED]
        contractVersion:
          type: string
          description: Current version of the contract (single-contract novation).
        contractVersions:
          type: object
          description: |
            Group novation: current version of every contract whose precondition failed (`null` for userIds
            of `expectedContractVersions` that are not in the group).
          additionalProperties:
            type: string
            nullable: true
        novated:
          type: array
          description: |
            Group novation only, rare: every precondition held when checked, but some contracts changed before
            their own write. Those are listed in `contractVersions` and were not written; the userIds listed
            here were novated.
          items:
            type: string
      example:
        error: CONTRACT_CHANGED
        contractVersion: 4-2c26b46b68ffc68f

    UserContact:
      type: object
      required:
        - userId
        - username
      properties:
        userId:
          type: string
          description: The id of the contract of the user
          example: 01c36d29-0d6a-4b41-83e9-8c6d9310c508
        username:
          type: string
          description: Username of the user
          example: johndoe
        firstName:
          type: string
          description: The first name of the user
          example: John
        lastName:
          type: string
          description: The last name of the user
          example: Doe
        email:
          type: string
          description: The email of the user
          example: john.doe@my-domain.com
        phone:
          type: string
          description: The phone number of the user, with international code
          example: +34 666 666 666

    BillingPeriod:
      type: object
      required:
        - startDate
        - endDate
      properties:
        startDate:
          description: The date on which the current billing period started
          $ref: '#/components/schemas/Date'
          example: '2025-04-18T00:00:00Z'
        endDate:
          description: The date on which the current billing period is expected to end or to be renewed
          $ref: '#/components/schemas/Date'
          example: '2025-12-31T00:00:00Z'
        autoRenew:
          type: boolean
          description: Determines whether the current billing period will be extended renewalDays days once it ends
          example: true
          default: true
        renewalDays:
          $ref: '#/components/schemas/RenewalDays'

    ContractedService:
      type: object
      description: Map where keys are service names and values are pricing versions
      additionalProperties:
        type: string
        format: path
        description: Pricing version to which the user is subscribed
      example:
        zoom: "2025"
        petclinic: "2024"

    SubscriptionPlans:
      type: object
      description: Map of service name to plan name
      additionalProperties:
        type: string
        minLength: 1
      example:
        zoom: ENTERPRISE
        petclinic: GOLD

    SubscriptionAddons:
      type: object
      description: Map of service name to add-ons and quantities
      additionalProperties:
        type: object
        additionalProperties:
          type: integer
          minimum: 0
      example:
        zoom:
          extraSeats: 2
          hugeMeetings: 1
        petclinic:
          petsAdoptionCentre: 1

    UsageLevels:
      type: object
      description: Usage levels for contracted services
      additionalProperties:
        type: object
        additionalProperties:
          type: object
          required:
            - consumed
          properties:
            resetTimestamp:
              description: Reset timestamp (only for renewable usage limits)
              $ref: '#/components/schemas/Date'
            consumed:
              type: number
              description: Consumed quota for the usage limit
              example: 5
      example:
        zoom:
          maxSeats:
            consumed: 10
        petclinic:
          maxPets:
            consumed: 2
          maxVisits:
            consumed: 5
            resetTimestamp: "2025-07-31T00:00:00Z"

    SubscriptionSnapshot:
      type: object
      properties:
        startDate:
          description: The date on which the user started using the snapshot
          $ref: '#/components/schemas/Date'
          example: '2024-04-18T00:00:00Z'
        endDate:
          description: The date on which the user finished using the snapshot
          $ref: '#/components/schemas/Date'
          example: '2024-04-17T00:00:00Z'
        contractedServices:
          $ref: '#/components/schemas/ContractedService'
        subscriptionPlans:
          $ref: '#/components/schemas/SubscriptionPlans'
        subscriptionAddOns:
          $ref: '#/components/schemas/SubscriptionAddons'

    Date:
      type: string
      format: date-time
      description: Date in UTC
      example: '2025-12-31T00:00:00Z'

    ObjectId:
      type: string
      description: ObjectId of the corresponding MongoDB document
      example: 68050bd09890322c57842f6f
      pattern: '^[a-f0-9]{24}$'
      readOnly: true

    RenewalDays:
      type: integer
      description: Number of days by which the billing period will be extended
      example: 365
      default: 30
      minimum: 1

    Feature:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          example: Premium Support
        description:
          type: string
        service:
          type: string

  requestBodies:
    SubscriptionCreation:
      description: Creates a new subscription within SPACE
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - userContact
              - subscriptionPlans
              - subscriptionAddOns
            properties:
              userContact:
                $ref: '#/components/schemas/UserContact'
              billingPeriod:
                type: object
                properties:
                  autoRenew:
                    type: boolean
                    description: Whether the billing period auto-renews
                    example: true
                    default: true
                  renewalDays:
                    $ref: '#/components/schemas/RenewalDays'
              contractedServices:
                allOf:
                  - $ref: '#/components/schemas/ContractedService'
                description: |
                  Optional. Services subscribed in `subscriptionPlans`/`subscriptionAddOns` without an entry here get
                  the version for new contracts (`GET /services/{serviceName}/pricings/new-contracts`). SPHERE-linked
                  services always get their policy target.
              subscriptionPlans:
                $ref: '#/components/schemas/SubscriptionPlans'
              rejectPrivate:
                type: boolean
                default: false
                description: |
                  Opt-in: reject private plans and add-ons (`PRIVATE_PLAN` / `PRIVATE_ADDON`), for contracts a
                  customer configures. Without it they are accepted, as before. Same as the query parameter
                  `rejectPrivate=true`; not stored.
              subscriptionAddOns:
                $ref: '#/components/schemas/SubscriptionAddons'
          example:
            userContact:
              userId: 01c36d29-0d6a-4b41-83e9-8c6d9310c508
              username: johndoe
              firstName: John
              lastName: Doe
              email: john.doe@my-domain.com
            billingPeriod:
              autoRenew: true
              renewalDays: 30
            contractedServices:
              zoom: "2025"
              petclinic: "2024"
            subscriptionPlans:
              zoom: ENTERPRISE
              petclinic: GOLD
            subscriptionAddOns:
              zoom:
                extraSeats: 2
              petclinic:
                petsAdoptionCentre: 1

    SubscriptionCompositionNovation:
      description: Novates the composition of an existent contract
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - subscriptionPlans
              - subscriptionAddOns
            properties:
              contractedServices:
                allOf:
                  - $ref: '#/components/schemas/ContractedService'
                description: |
                  Optional. Services subscribed in `subscriptionPlans`/`subscriptionAddOns` without an entry here keep
                  the version the contract has (or, if the contract does not have them, get the version for new
                  contracts). SPHERE-linked services follow their synchronization policy.
              subscriptionPlans:
                $ref: '#/components/schemas/SubscriptionPlans'
              subscriptionAddOns:
                $ref: '#/components/schemas/SubscriptionAddons'
              keepBillingPeriod:
                type: boolean
                default: false
                description: |
                  Keep the current billing period (start and end date) instead of starting a new one. The previous
                  subscription is still added to `history`. Same as the query parameter `keepBillingPeriod=true`.
              rejectPrivate:
                type: boolean
                default: false
                description: |
                  Opt-in: reject private plans and add-ons the contract does not have yet (`PRIVATE_PLAN` /
                  `PRIVATE_ADDON`), for changes a customer makes. Private plans and add-ons the contract already
                  has can always be kept. Without it they are accepted, as before (operator-assigned deals).
                  Same as the query parameter `rejectPrivate=true`; not stored.
              expectedContractVersion:
                type: string
                description: |
                  `PUT /contracts/{userId}` only. Apply the novation only if the contract still has this
                  `contractVersion`; otherwise answer `412`. Same as `If-Match`; if both are sent, `If-Match`
                  must list this version (or be `*`). On `PUT /contracts?groupId=` it answers `400`: use
                  `expectedContractVersions`.
              expectedContractVersions:
                type: object
                description: |
                  `PUT /contracts?groupId=` only. userId -> `contractVersion` of every contract of the group.
                  Apply the novation only if each of them still has that version; otherwise answer `412` with
                  the current versions and write nothing.
                additionalProperties:
                  type: string
          example:
            contractedServices:
              zoom: "2025"
              petclinic: "2024"
            subscriptionPlans:
              zoom: PRO
              petclinic: GOLD
            subscriptionAddOns:
              zoom:
                extraSeats: 1

    SubscriptionUserContactNovation:
      description: Updates the contact information of a user from their contract
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              firstName:
                type: string
                example: John
              lastName:
                type: string
                example: Doe
              email:
                type: string
                example: john.doe@my-domain.com
              username:
                type: string
                example: johndoe
              phone:
                type: string
                example: +34 666 666 666

    SubscriptionBillingNovation:
      description: Updates the billing information from a contract
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              endDate:
                $ref: '#/components/schemas/Date'
              autoRenew:
                type: boolean
                example: true
                default: true
              renewalDays:
                $ref: '#/components/schemas/RenewalDays'
          example:
            endDate: '2025-12-31T00:00:00Z'
            autoRenew: true
            renewalDays: 30

    SubscriptionUsageLevelsUpdate:
      description: Updates usage levels for a contract
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties:
              type: object
              additionalProperties:
                type: number
          example:
            zoom:
              maxSeats: 10
            petclinic:
              maxPets: 2
              maxVisits: 5

  headers:
    ContractETag:
      description: '`"<contractVersion>"` of the returned contract.'
      schema:
        type: string
      example: '"3-9f86d081884c7d65"'

  responses:
    InvalidSubscription:
      description: |
        The subscription is not valid. `errors` lists every problem with a stable `code`. Contract creation always
        answers `400`; novations answer `404` when every problem is a missing plan, add-on or version (as before)
        and `400` otherwise.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InvalidSubscription'
    ContractChanged:
      description: The contract changed since the given version (`If-Match`/`expectedContractVersion`). Nothing was written.
      headers:
        ETag:
          $ref: '#/components/headers/ContractETag'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ContractChanged'
    ContractNotFound:
      description: |
        No contract with this `userId` exists in the caller's organization (contracts of other
        organizations are reported the same way).
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: Contract with userId 01c4a3cb-0bd5-4d4f-bc1a-0d5bb3d1f6a3 not found
    DormantService:
      description: |
        The request needs a service of the contract that is disabled (`SERVICE_DISABLED`; it is dormant until a
        pricing with its saasName is uploaded again) or that the organization no longer has
        (`SERVICE_NOT_FOUND`), e.g. `?revert=true` on one of its features. Nothing was changed.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: string
                enum: [SERVICE_DISABLED, SERVICE_NOT_FOUND]
              service:
                type: string
    OrganizationIdRequired:
      description: |
        Platform ADMIN on a direct route that addresses contracts by `userId` or `groupId`, without
        `organizationId`. A `userId` (or `groupId`) is only unique within an organization, so the organization
        is part of what identifies the contract. Checked before anything is read, locked or written. Repeat the
        request with `?organizationId=<id>` or through `/organizations/{organizationId}/contracts/...`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OrganizationIdRequiredError'
    UnprocessableEntity:
      description: Request sent could not be processed properly
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  $ref: '#/components/schemas/FieldValidationError'

  parameters:
    ContractOrganizationId:
      name: organizationId
      in: query
      required: false
      description: |
        Organization whose contracts a platform ADMIN user lists or prunes on `GET` / `DELETE /contracts`;
        without it, every organization. Organization API keys and organization-scoped routes already have an
        organization: the parameter may repeat it, any other value answers `403`.
      schema:
        type: string
    AdminContractOrganizationId:
      name: organizationId
      in: query
      required: false
      description: |
        Organization of the contract(s). **Required for platform ADMIN users** on the direct routes that address
        contracts by `userId` or `groupId`: a `userId` (or `groupId`) is only unique within an organization.
        Without it they get `400` with `code: ORGANIZATION_ID_REQUIRED` (see `OrganizationIdRequired`) and nothing
        is read or changed. Not needed with an organization API key or on the organization-scoped routes, which
        already have an organization: the parameter may repeat it, any other value answers `403`; a repeated
        parameter answers `400`.
      schema:
        type: string
    RejectPrivate:
      name: rejectPrivate
      in: query
      required: false
      description: |
        Opt-in: `true` rejects private plans and add-ons that the contract does not already have
        (`PRIVATE_PLAN` / `PRIVATE_ADDON`), for subscriptions a customer configures. Default: they are accepted,
        as before. Same as the body field `rejectPrivate: true`.
      schema:
        type: boolean
        default: false
    PricingFormat:
      name: format
      in: query
      required: false
      description: |
        `json` (default): the parsed pricing, as before. `yaml`: the stored Pricing2Yaml file of the version, byte for
        byte (`Content-Type: application/yaml; charset=utf-8`), with `X-Pricing-Syntax-Version` and
        `ETag: "<sha256 hex of the body>"`. For SPHERE-linked services, versions SPACE no longer keeps are fetched
        from SPHERE and checked against its content hash.
      schema:
        type: string
        enum: [json, yaml]
        default: json
    IfNoneMatchPricingYaml:
      name: If-None-Match
      in: header
      required: false
      description: '`format=yaml` only: answer `304` when the file still has this ETag.'
      schema:
        type: string
    KeepBillingPeriod:
      name: keepBillingPeriod
      in: query
      required: false
      description: |
        `true` keeps the current billing period (start and end date) instead of starting a new one; the previous
        subscription is still added to `history`. Default: the billing period restarts, as before.
      schema:
        type: boolean
        default: false
    IfMatchContractVersion:
      name: If-Match
      in: header
      required: false
      description: |
        `"<contractVersion>"` the novation is conditional on, or a comma-separated list of them (any one
        may match). Comparison is strong: weak tags (`W/"..."`) never match. An unquoted value is taken as
        one tag, and `*` matches any current version. On mismatch the request fails with
        `412 CONTRACT_CHANGED` and nothing is written. Without it (and without `expectedContractVersion`) the novation is unconditional,
        as before.
      schema:
        type: string
      example: '"3-9f86d081884c7d65"'
    Username:
      name: username
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Username'

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: |
        API Key for authentication. Two types are supported:
        - **User API Key** (format: `usr_*`): Obtained from POST /users/authenticate endpoint
        - **Organization API Key** (format: `org_*`): Created in organization settings
