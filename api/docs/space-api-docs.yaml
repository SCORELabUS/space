tags:
  - name: Authentication
    description: User authentication and API key management
  - name: Users
    description: User account management (User API Key only)
  - name: Organizations
    description: Organization management (User API Key only)
  - name: Services
    description: Service and pricing management (both API key types)
  - name: Contracts
    description: Subscription contract management (both API key types)
  - name: Features
    description: Feature evaluation and toggle management (Org API Key only)
  - name: Analytics
    description: System usage analytics (User ADMIN or Org Key with MANAGEMENT)
  - name: Cache
    description: Cache management (User ADMIN only)
  - name: Events
    description: |
      WebSocket events (Socket.IO, path `/events`, transport `websocket`).

      - Namespace `/pricings` (public): `message` events `{ code: PRICING_CREATED | PRICING_ARCHIVED |
        PRICING_ACTIVED | SERVICE_DISABLED, details: { serviceName, pricingVersion? } }`.
      - Namespace `/contracts` (authenticated): handshake `auth: { apiKey }` or an `x-api-key` header. Organization
        API keys of any scope receive the events of their organization; user API keys must also send
        `auth.organizationId` of an organization they own or belong to (ADMIN users: any organization). Only events
        of that organization are delivered, as `message` events
        `{ code: CONTRACT_CREATED | CONTRACT_NOVATED | CONTRACT_DELETED | CONTRACT_RENEWED,
        details: { userId, organizationId, contractVersion, services } }` (`contractVersion` is `null` for
        `CONTRACT_DELETED`; `services` are the contracted services). Events are emitted after the change is stored,
        including novations by group (also the contracts a partly rejected guarded group novation did write),
        billing period changes (`CONTRACT_NOVATED`, since they change `contractVersion`), SPHERE synchronization,
        archiving a pricing version, and deleting all contracts of the organization (one `CONTRACT_DELETED` per
        contract). A novation preview emits nothing. A rejected handshake fails with `connect_error`; when the
        credential could not be checked (database unavailable) the message says so instead of reporting an
        invalid key, and the client may retry.

        Authorization is checked at the handshake and again before each private event is delivered. Removing or
        rotating a key, removing a membership, deleting a user or losing ADMIN authority disconnects affected
        subscriptions. Authority changes are propagated between API instances through the Redis adapter; a missed
        notification cannot authorize a later event because each receiving instance checks its local connections.
        If authority cannot be checked, delivery is refused and the subscription disconnects. Authorized
        subscriptions to other organizations remain connected. Clients may reconnect with a valid credential.
  - name: Healthcheck
    description: Service health verification (Public)

paths:
  /services/sphere/preview:
    post:
      security:
        - ApiKeyAuth: []
      summary: Preview a SPHERE pricing and validate access
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                permanentUrl:
                  type: string
                  format: uri
                policy:
                  type: string
                  enum: [all_last, new_last, all_pick, new_pick]
                selectedVersionId:
                  type: string
                serviceName:
                  type: string
                  description: >-
                    Optional existing linked service in the authenticated organization. The permanent link must
                    match its stored pricing identity. If sphereApiKey is omitted, the server uses its stored
                    credential without returning it to the caller.
                sphereApiKey:
                  type: string
                  nullable: true
                  writeOnly: true
                  description: >-
                    Optional SPHERE API key used for this preview only, never stored. With it SPHERE also lists
                    permitted private versions. Null previews anonymous access, even when serviceName has a saved key.
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SphereManifest'
        "400":
          description: Invalid configuration, restricted or unavailable SPHERE pricing, rejected key or unavailable credential storage
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  code:
                    type: string
                    enum: [SPHERE_ACCESS_REQUIRED, SPHERE_KEY_REJECTED, SPHERE_CREDENTIAL_STORAGE_UNAVAILABLE]
                    description: >-
                      Present for access/key/storage failures. ACCESS_REQUIRED does not prove a resource is private:
                      SPHERE also hides missing resources with 404. Network and upstream 500 failures do not use an access code.
        "404":
          description: Resource not available
        "202":
          description: Synchronization queued
        "409":
          description: Synchronization is applying or configuration conflicts
  /services/{serviceName}/synchronization:
    get:
      security:
        - ApiKeyAuth: []
      summary: Read or update SPHERE synchronization configuration
      parameters:
        - in: path
          name: serviceName
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SphereSyncState'
        "400":
          description: Invalid source or configuration
        "404":
          description: Resource not available
        "202":
          description: Synchronization queued
        "409":
          description: Synchronization is applying or configuration conflicts
    put:
      security:
        - ApiKeyAuth: []
      summary: Read or update SPHERE synchronization configuration
      parameters:
        - in: path
          name: serviceName
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                permanentUrl:
                  type: string
                  format: uri
                policy:
                  type: string
                  enum: [all_last, new_last, all_pick, new_pick]
                selectedVersionId:
                  type: string
                pollIntervalMinutes:
                  type: integer
                  enum: [1, 5, 15]
                sphereApiKey:
                  type: string
                  nullable: true
                  writeOnly: true
                  description: >-
                    SPHERE API key (`sk-...`) to read private versions. Write-only: stored encrypted (AES-256-GCM,
                    key from `SPHERE_KEY_ENCRYPTION_KEY`) and never returned; responses show
                    `configuration.hasApiKey`. Omit to keep the stored key, `null` removes it. Rejected with 400
                    when `SPHERE_KEY_ENCRYPTION_KEY` is not set or SPHERE refuses the key.
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SphereSyncState'
        "400":
          description: Invalid source or configuration
        "404":
          description: Resource not available
        "202":
          description: Synchronization queued
        "409":
          description: Synchronization is applying or configuration conflicts
  /services/{serviceName}/synchronization/run:
    post:
      security:
        - ApiKeyAuth: []
      summary: Queue synchronization and return persistent status
      parameters:
        - in: path
          name: serviceName
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                permanentUrl:
                  type: string
                  format: uri
                policy:
                  type: string
                  enum: [all_last, new_last, all_pick, new_pick]
                selectedVersionId:
                  type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SphereSyncState'
        "400":
          description: Invalid source or configuration
        "404":
          description: Resource not available
        "202":
          description: Synchronization queued
        "409":
          description: Synchronization is applying or configuration conflicts
  /services/{serviceName}/synchronization/resume:
    post:
      security:
        - ApiKeyAuth: []
      summary: Reactivate a linked service and resume synchronization, preserving contracts
      parameters:
        - in: path
          name: serviceName
          required: true
          schema:
            type: string
      description: >-
        Reactivates the existing SPHERE service without changing its permanent link, credential, policy,
        contracted versions, usage or billing dates. Queues synchronization under the existing new/all policy.
        Requires the same organization management authority as synchronization. Repeated activation is safe.
      responses:
        "202":
          description: Service reactivated and synchronization queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SphereSyncState'
        "400":
          description: Invalid source or configuration
        "404":
          description: Resource not available
        "409":
          description: Synchronization is applying or configuration conflicts
  /organizations/{organizationId}/services/sphere/preview:
    post:
      security:
        - ApiKeyAuth: []
      summary: Preview a SPHERE pricing and validate access
      parameters:
