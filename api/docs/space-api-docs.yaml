openapi: 3.0.4

info:
  title: SPACE API
  description: |
    # SPACE - Subscription and Pricing Access Control Engine

    SPACE is a pricing-driven self-adaptation microservice that leverages the iPricing and iSubscription metamodels to enforce feature-level access control in accordance with the terms of active subscription contracts.

    The API enables you to:
    - **Manage pricing for multiple services**
    - **Store and manage contracts**
    - **Enforce subscription compliance**

    ## Authentication & API Keys

    SPACE supports two types of API keys, each serving a different purpose:

    ### User API Keys
    - **Purpose**: Manage user accounts, organizations, services and pricing from the SPACE UI.
    - **Obtaining**: Authenticate via `POST /users/authenticate` endpoint with username and password
    - **Usage**: Include in `x-api-key` header for requests
    - **Accessible Roles**: `ADMIN` (full access), `USER` (access limited to own account and organizations)
    - **Access Pattern**: Can access `/users/**` and `/organizations/**` routes
    - **Example Use Cases**: 
      - Creating services
      - Managing organizations and their members
      - Viewing analytics

    ### Organization API Keys
    - **Purpose**: Perform programmatic operations within an organization's context
    - **Obtaining**: Created by organization owners/admins/managers via `POST /organizations/:organizationId/api-keys`
    - **Usage**: Include in `x-api-key` header for requests
    - **Accessible Scopes**: 
      - `ALL`: Full access to organization resources and management operations
      - `MANAGEMENT`: Full access to organization resources and limited management operations
      - `EVALUATION`: Read-only access to services/pricings, plus feature evaluation: `POST /features/{userId}`,
        `POST /features/{userId}/{featureId}` (including the expected consumption it records and `?revert=true`)
        and `POST /features/{userId}/pricing-token`. It cannot write contracts, usage levels
        (`PUT /contracts/{userId}/usageLevels`), services or pricings.
    - **Access Pattern**: Can access `/services/**`, `/contracts/**`, `/features/**` routes
    - **Example Use Cases**: 
      - Programmatically manage services and pricings
      - Evaluate access to features
      - Manage contracts

    ## Organization Roles

    Users within an organization can have the following roles:

    | Role          | Permissions |
    |---------------|-------------|
    | **OWNER**     | Full control: add/remove members, manage API keys, update organization, transfer ownership |
    | **ADMIN**     | Nearly full control except cannot transfer ownership |
    | **MANAGER**   | Can manage members and services, limited API key operations (cannot perform operations on ALL-scoped API Keys) |
    | **EVALUATOR** | Read-only access to services and feature evaluation, can only remove themselves |

    ## Permission Summary by Endpoint Category

    All endpoints require an `x-api-key` header unless explicitly marked as **Public**.

    - **Public**: No authentication required
    - **User Key (ADMIN)**: Requires User API Key with ADMIN role
    - **User Key (USER)**: Requires User API Key with USER role (or ADMIN)
    - **Org Key (scope)**: Requires Organization API Key with specified scope
    - **Org Members (role)**: Requires User API key. If the key does not have ADMIN role, the user must be a member of the organization and have –at least– the specified role.

    ## Organization isolation of contracts

    Contracts are addressed by `userId`, which is chosen by the host application. Every route that takes a
    `userId` (`/contracts/{userId}/**`, `/organizations/{organizationId}/contracts/{userId}`,
    `/features/{userId}/**`) only finds contracts of the caller's organization: the organization of the
    organization API key, or the `organizationId` of the route for user API keys (also for platform ADMIN
    users). A contract of another organization is reported as `404`, exactly like a `userId` that does not
    exist. Only a platform ADMIN user calling the direct `/contracts/{userId}` routes is not confined (see
    below).

    ## userId unique per organization

    A `userId` is unique within an organization, not across the server: two organizations may each have a
    contract for user `42` (unique index `{ organizationId, userContact.userId }`). `POST /contracts` answers
    `409` only for a `userId` the caller's own organization already uses; a `userId` of another organization
    neither conflicts nor is revealed. Moving a service to another organization (`PUT /services/{serviceName}`
    with `organizationId`) answers `409` when a contract it would move has a `userId` the target organization
    already uses, and changes nothing.

    Contract events and pricing tokens identify the contract by organization and `userId`: events carry
    `details.organizationId` and only reach that organization; in pricing tokens `sub` is the URN
    `urn:space:<organizationId>:<percent-encoded userId>`, the `userId` and `organizationId` claims carry both
    parts, `aud` is the organization and `iss` names the SPACE server (see `PricingTokenPayload`). Verifiers
    should check `iss` and `aud` (the organization they serve) and read the user from `userId`; clients must
    not parse `sub`.

    Platform ADMIN users on the direct routes that address contracts by `userId` or `groupId`
    (`/contracts/{userId}/**`, `PUT /contracts?groupId=`, `PUT /contracts/billingPeriod?groupId=`) must
    always name the organization, with the `organizationId` query parameter or through the
    organization-scoped routes (`/organizations/{organizationId}/contracts/...`). Without it they get `400`
    with `code: ORGANIZATION_ID_REQUIRED`, before anything is read, locked or written, even when only one
    organization has that `userId`. `GET` and `DELETE /contracts` accept `organizationId` to list or prune one
    organization and, without it, cover every organization. Any other caller already has an organization:
    `organizationId` may repeat it, and anything else answers `403`.

    ## Disabling and deleting services

    **Disabling** a service (`DELETE /services/{serviceName}`, `DELETE /organizations/{organizationId}/services/{serviceName}`)
    is reversible: its pricings are archived, `SERVICE_DISABLED` is announced on `/pricings`, and uploading a pricing with
    the same `saasName` enables it again (the versions it had stay archived). Contracts are not changed: the service is
    *dormant* in the contracts that have it, and every reader of a contract treats it so:
    - Evaluation of all features (`POST /features/{userId}`) and the pricing token leave its features out, as for any
      feature the subscription does not have; the other services of the contract evaluate normally. The token lists it
      in the `dormantServices` claim; its `subscription` claim is still the contract.
    - Evaluation of one of its features (`POST /features/{userId}/{featureId}`) answers `200` with `eval: false` and
      `error.code: SERVICE_DISABLED`, like `FLAG_NOT_FOUND` for an unknown feature. Nothing is consumed: an expected
      consumption gets the same answer, and `?revert=true` answers `409 SERVICE_DISABLED`.
    - `PUT /contracts/{userId}/usageLevels` answers `409 SERVICE_DISABLED` for increments of its usage levels; resets leave them as they are (and so does the automatic renewal of renewable levels).
    - `GET /contracts/{userId}/pricings` marks it with `serviceStatus: disabled`.
    - Novations may keep it exactly as it is (same version, plan and add-ons; listed in the preview's `dormantServices`),
      but not subscribe to it or change it (`VERSION_NOT_FOUND`, as for an unknown service). New contracts cannot use it.
    - Cached evaluations and pricing tokens of the organization are dropped when it is disabled. Pricing tokens already
      handed out stay valid until they expire.
    When the service is enabled again, the contracts work as before, with their subscription and usage levels.

    **Deleting** services (`DELETE /services`, `DELETE /organizations/{organizationId}/services`) is irreversible: they
    are removed from every contract of the organization (`contractedServices`, `subscriptionPlans`,
    `subscriptionAddOns`, `usageLevels`; names compared case-insensitively). The previous subscription is recorded in
    the contract history and each changed contract gets a `CONTRACT_NOVATED` event. A contract left without services is
    kept (user contact and history included): its billing period ends at that moment and it no longer renews, so it can
    be novated to other services or deleted with `DELETE /contracts/{userId}`. Each contract is written only if it did
    not change since it was read (a concurrent novation is never overwritten; the removal is retried). The contracts
    are updated before the services are deleted, so a failure (`500`, or `409` when a contract keeps changing) deletes
    nothing and the request can be repeated.

    ## Renaming and moving services

    `PUT /services/{serviceName}` (and the organization-scoped route) with `name` and/or `organizationId` updates
    every contract of the organization that has the service (all of them, names compared case-insensitively):
    - **Rename**: the service is renamed in `contractedServices`, `subscriptionPlans`, `subscriptionAddOns` and
      `usageLevels` (consumption included). `contractVersion` changes (it covers the service names), so each contract
      gets a `CONTRACT_NOVATED` event, and its cached evaluations and pricing token are dropped (feature ids carry the
      service name).
    - **Move** to another organization: contracts that only have this service move with it. The organization they
      leave gets `CONTRACT_DELETED` (they are no longer found there) and the new one gets `CONTRACT_CREATED` (its
      consumers did not know them); `contractVersion` does not change unless the service is also renamed. Contracts
      with other services stay and lose this one, as when it is deleted (history recorded, `CONTRACT_NOVATED`).
    - The pricings of the service follow it (`GET .../services/{newName}/pricings` in its organization).
    Everything that can refuse the request is checked first, and a `409` changes nothing: the name is taken by
    another service (enabled or disabled) of the organization the service would be in, a contract already has a
    service with the new name, or a contract that would move has a `userId` the target organization already uses.
    Each contract is written only if it did not change since it was read (a concurrent novation or consumption is
    never overwritten; the contract is read again and retried). Contracts are written before the service, so after
    a failure the request can be repeated; contracts created with the old name while the request runs are updated
    after the service is.

    ## Capabilities

    Every response (errors and CORS preflights included) carries `X-Space-Capabilities`, a comma-separated
    list of the optional API features this server implements. It is exposed to browsers through CORS.
    Clients should check a token before relying on the guarantee it stands for, and fail instead of
    silently writing without it. Tokens:

    - `contract-org-scope`: `userId` lookups are confined to the caller's organization (see above).
    - `contract-version`: contracts carry `contractVersion` and an `ETag`; novations accept `If-Match` / `expectedContractVersion` and answer `412 CONTRACT_CHANGED`.
    - `keep-billing-period`: `keepBillingPeriod` on novations, and subscriptions validated strictly against the pricing (`400` with `errors`; archived versions rejected for new contracts and version changes).
    - `reject-private`: the opt-in `rejectPrivate` option (query or body) of contract creation and novations, which rejects private plans and add-ons.
    - `pricing-yaml`: `GET .../pricings/{version}?format=yaml` returns the stored Pricing2Yaml file.
    - `new-contracts-version`: `GET .../pricings/new-contracts` and the optional service `defaultVersion`.
    - `contract-pricings`: `GET /contracts/{userId}/pricings`.
    - `novation-preview`: `POST /contracts/{userId}/novation/preview`.
    - `token-subscription`: the pricing token carries the `subscription` claim.
    - `contract-events`: authenticated Socket.IO namespace `/contracts` with contract events.
    - `sphere-private`: SPHERE-linked services accept a write-only `sphereApiKey` to read private versions (`sphere.hasApiKey`); private versions are never served statically.
    - `contract-userid-per-org`: a `userId` is unique per organization (see above), pricing tokens identify the contract by organization (`sub` = `urn:space:<organizationId>:<percent-encoded userId>`, `userId`, `organizationId`, `aud`, `iss`; see `PricingTokenPayload`), and platform ADMIN users name the organization (`organizationId`) on the direct routes that address contracts by `userId` or `groupId` (`400 ORGANIZATION_ID_REQUIRED` otherwise).
    - `service-disable-dormant`: a disabled service is dormant in contracts and deleting services removes them from every contract (see "Disabling and deleting services").

