          in: path
          required: true
          schema:
            type: string
        - name: pricingVersion
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Pricing deleted
        '403':
          description: Forbidden

  /organizations/{organizationId}/contracts:
    get:
      summary: List contracts in organization
      description: |
        Lists all contracts in the organization with optional filtering and pagination.

        **Authentication**: User API Key

        **Permission**: 
        - USER user: must be an organization member with any role (OWNER/ADMIN/MANAGER/EVALUATOR)
        - ADMIN user: can view contracts in any organization

        **Request Filters**:
        - Query parameters (`/organizations/{id}/contracts?username=john&limit=50`): Basic filters with pagination
        - Request body (with filters object): Complex/advanced filtering via JSON body
        - Combined: Both query and body filters are merged (body filters override query filters)

        **Response Format**:
        - Plain array of Contract objects (not paginated wrapper)
        - Total count provided via `X-Total-Count` response header

      tags:
        - Contracts
      security:
        - ApiKeyAuth: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
          description: The organization ID (must be valid MongoDB ObjectId)
          example: 507f1f77bcf86cd799439011
        - name: username
          in: query
          required: false
          schema:
            type: string
          description: Filter contracts by username (case-insensitive regex match)
          example: john_doe
        - name: firstName
          in: query
          required: false
          schema:
            type: string
          description: Filter contracts by user's first name (case-insensitive regex match)
          example: John
        - name: lastName
          in: query
          required: false
          schema:
            type: string
          description: Filter contracts by user's last name (case-insensitive regex match)
          example: Doe
        - name: email
          in: query
          required: false
          schema:
            type: string
          description: Filter contracts by user email (case-insensitive regex match)
          example: john@example.com
        - name: groupId
          in: query
          required: false
          schema:
            type: string
          description: Filter contracts by group ID
          example: my-group
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
          description: |
            Page number for pagination (1-based). 
            **Note**: Ignored when `offset > 0`.
          example: 1
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
          description: |
            Number of contracts to skip (0-based offset). 
            **Precedence**: When `offset > 0`, it overrides the `page` parameter.
          example: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
          description: Maximum number of contracts to return per page
          example: 20
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [firstName, lastName, username, email]
          description: Field to sort contracts by
          example: firstName
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: asc
          description: Sort order (ascending or descending)
          example: asc
      responses:
        '200':
          description: List of contracts (plain array with total count in header)
          headers:
            X-Total-Count:
              schema:
                type: integer
              description: Total number of contracts matching the filters
              example: 25
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Contract'
              examples:
                contractsList:
                  summary: List of contracts for organization
                  value:
                    - id: 507f1f77bcf86cd799439011
                      userId: user123
                      organizationId: org456
                      userContact:
                        username: john_doe
                        firstName: John
                        lastName: Doe
                        email: john@example.com
                      billingPeriod:
                        startDate: "2024-01-01"
                        endDate: "2024-12-31"
                      contractedServices: []
                      subscriptionPlans: []
                      subscriptionAddons: []
                      subscriptionSnapshot: {}
                      usageLevels: []
        '400':
          description: Invalid query parameters or request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - missing or invalid API key
        '403':
          description: Forbidden - not a member of this organization

    post:
      summary: Create contract in organization
      description: |
        Creates a new subscription contract in the organization.

        **Authentication**: User API Key

        **Permission**: 
        - USER user: must have OWNER/ADMIN/MANAGER role
        - ADMIN user: can create contracts in any organization

      tags:
        - Contracts
      security:
        - ApiKeyAuth: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/RejectPrivate'
      requestBody:
        $ref: '#/components/requestBodies/SubscriptionCreation'
      responses:
        '201':
          description: Contract created
          headers:
            ETag:
              $ref: '#/components/headers/ContractETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
        '403':
          description: Forbidden
        '400':
          $ref: '#/components/responses/InvalidSubscription'
        '409':
          description: The caller's organization already has a contract for this `userId` (a `userId` of another organization does not conflict)

    put:
      summary: Update contracts by group ID
      description: |
        Updates the details of all contracts in a group (contract novation - subscription composition change).

        **Authentication**: User API Key (ADMIN) | Organization API Key

        **User Permission**: 
        - ADMIN user: can update contracts in any organization

        **Organization Permission**:
        - ALL scope: can update contracts in the organization
        - MANAGEMENT scope: can update contracts in the organization

      tags:
        - Contracts
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/KeepBillingPeriod'
        - $ref: '#/components/parameters/RejectPrivate'
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: groupId
          in: query
          required: true
          schema:
            type: string
      requestBody:
        $ref: '#/components/requestBodies/SubscriptionCompositionNovation'
      responses:
        '200':
          description: Contracts updated
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Contract'
        '412':
          $ref: '#/components/responses/ContractChanged'
        '400':
          description: |
            Missing groupId; an `If-Match` header or an `expectedContractVersion` field (use
            `expectedContractVersions` for groups); or an invalid subscription (body `InvalidSubscription`,
            with `errors[].code`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidSubscription'
        '404':
          description: Contract (or group) not found, or every subscription problem is a missing plan, add-on or version (`InvalidSubscription`)

    delete:
      summary: Delete all contracts in organization
      description: |
        Deletes all subscription contracts in the organization (irreversible).

        **Authentication**: User API Key

        **Permission**: 
        - USER user: must have OWNER/ADMIN role with the organization
        - ADMIN user: can delete contracts in any organization

      tags:
        - Contracts
      security:
        - ApiKeyAuth: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: All contracts deleted
        '403':
          description: Forbidden

