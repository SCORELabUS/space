components:
  schemas:
    SphereVersion:
      type: object
      required: [versionId, version, createdAt, contentHash]
      properties:
        versionId: { type: string, pattern: '^[a-f0-9]{24}$' }
        version: { type: string }
        createdAt: { type: string, format: date-time }
        contentHash: { type: string, description: SHA-256 of canonical functional pricing content }
    SphereConfiguration:
      type: object
      required: [permanentUrl, policy]
      properties:
        permanentUrl: { type: string, format: uri }
        policy:
          type: string
          enum: [all_last, new_last, all_pick, new_pick]
          description: All migrates current bindings with cheapest-valid-plan fallback. New preserves them. Last orders public versions by pricing date. Pick requires selectedVersionId.
        selectedVersionId:
          type: string
          description: Required for all_pick and new_pick; immutable public SPHERE version ID.
        acceptedSyntaxUpgradeVersionId:
          type: string
          description: Required only when preview reports a syntax upgrade; must equal that inspected public version ID.
        pollIntervalMinutes:
          type: integer
          enum: [1, 5, 15]
          default: 5
          description: How often SPACE checks SPHERE for a newer public version for this linked service.
    SphereCreateService:
      allOf:
        - $ref: '#/components/schemas/SphereConfiguration'
        - type: object
          required: [source]
          properties:
            source: { type: string, enum: [sphere] }
    SphereManifest:
      type: object
      required: [pricingId, name, permanentUrl, latestVersionId, versions]
      properties:
        pricingId: { type: string }
        name: { type: string }
        permanentUrl: { type: string, format: uri }
        latestVersionId: { type: string }
        versions:
          type: array
          items: { $ref: '#/components/schemas/SphereVersion' }
        syntaxUpgrade:
          type: object
          nullable: true
          description: The selected source version requires explicit confirmation before SPACE stores its upgraded YAML snapshot.
          properties:
            versionId: { type: string }
            from: { type: string }
            to: { type: string }
    SphereSyncState:
      type: object
      properties:
        source: { type: string, enum: [manual, sphere] }
        configuration:
          allOf:
            - $ref: '#/components/schemas/SphereConfiguration'
            - type: object
              properties:
                target: { $ref: '#/components/schemas/SphereVersion' }
                revision: { type: integer }
                status: { type: string, enum: [ready, queued, checking, applying, blocked, degraded] }
                error: { type: string, nullable: true }
                lastCheckedAt: { type: string, format: date-time }
                lastSyncedAt: { type: string, format: date-time }
                migrated: { type: integer }
                replaced: { type: integer }
        retainedVersions:
          type: array
          items:
            type: object
            properties:
              version: { type: string }
        run:
          type: object
          nullable: true
          description: Persistent execution including ID, candidate, status, migrated/replaced counts and recoverable error.
    Username:
      type: string
      description: Username of the user
      example: johndoe
      minLength: 3
      maxLength: 30

    Password:
      type: string
      description: Password of the user
      example: j0hnD03
      minLength: 5

    Role:
      type: string
      description: Role of the user
      enum: [ADMIN, USER]
      example: USER

    ApiKey:
      type: string
      description: Random 32 byte string encoded in hexadecimal
      example: usr_9cedd24632167a021667df44a26362dfb778c1566c3d4564e132cb58770d8c67
      pattern: '^usr_[a-f0-9]{64}$'
      readOnly: true

    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    FieldValidationError:
      type: object
      properties:
        type:
          type: string
          example: field
        msg:
          type: string
          example: Password must be a string
        path:
          type: string
          example: password
        location:
          type: string
          example: body
        value:
          example: invalid
      required:
        - type
        - msg
        - path
        - location

    UserInput:
      type: object
      properties:
        username:
          $ref: '#/components/schemas/Username'
        password:
          $ref: '#/components/schemas/Password'
        role:
          $ref: '#/components/schemas/Role'
      required:
        - username
        - password

    UserUpdate:
      type: object
      properties:
        username:
          $ref: '#/components/schemas/Username'
        password:
          $ref: '#/components/schemas/Password'
        role:
          $ref: '#/components/schemas/Role'
    User:
      type: object
      properties:
        username:
          $ref: '#/components/schemas/Username'
        apiKey:
          $ref: '#/components/schemas/ApiKey'
        role:
          $ref: '#/components/schemas/Role'
        createdAt:
          type: string
          format: date-time

    Organization:
      type: object
      properties:
        id:
          type: string
          example: 507f1f77bcf86cd799439012
        name:
          type: string
          example: ACME Corporation
        owner:
          type: string
          example: john_doe
        default:
          type: boolean
          example: false
        members:
          type: array
          items:
            type: object
            properties:
              username:
                type: string
              role:
                type: string
                enum: [OWNER, ADMIN, MANAGER, EVALUATOR]
        apiKeys:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              scope:
                type: string
                enum: [ALL, MANAGEMENT, EVALUATION]
        createdAt:
          type: string
          format: date-time

    Service:
      type: object
      properties:
        name:
          type: string
          example: Zoom
        description:
          type: string
          example: Video conferencing platform
        organization:
          type: string
        available:
          type: boolean
        pricings:
          type: array
          items:
            $ref: '#/components/schemas/Pricing'
        createdAt:
          type: string
          format: date-time

    Pricing:
      type: object
      properties:
        version:
          type: string
          example: "1.0.0"
        service:
          type: string
        available:
          type: boolean
        plans:
          type: array
          items:
            type: object
        addOns:
          type: array
          items:
            type: object
        createdAt:
          type: string
          format: date-time

    Contract:
      type: object
      description: |
        Contract representation compatible with iSubscription.
      required:
        - billingPeriod
        - organizationId
        - usageLevels
        - contractedServices
        - subscriptionPlans
        - history
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        organizationId:
          type: string
          description: Organization identifier owning the contract
          example: 507f1f77bcf86cd799439012
        userContact:
          $ref: '#/components/schemas/UserContact'
        billingPeriod:
          $ref: '#/components/schemas/BillingPeriod'
        usageLevels:
          $ref: '#/components/schemas/UsageLevels'
        contractedServices:
          $ref: '#/components/schemas/ContractedService'
        subscriptionPlans:
          $ref: '#/components/schemas/SubscriptionPlans'
        subscriptionAddOns:
          $ref: '#/components/schemas/SubscriptionAddons'
        history:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionSnapshot'

    UserContact:
      type: object
      required:
        - userId
        - username
      properties:
        userId:
          type: string
          description: The id of the contract of the user
          example: 01c36d29-0d6a-4b41-83e9-8c6d9310c508
        username:
          type: string
          description: Username of the user
          example: johndoe
        firstName:
          type: string
          description: The first name of the user
          example: John
        lastName:
          type: string
          description: The last name of the user
          example: Doe
        email:
          type: string
          description: The email of the user
          example: john.doe@my-domain.com
        phone:
          type: string
          description: The phone number of the user, with international code
          example: +34 666 666 666

    BillingPeriod:
      type: object
      required:
        - startDate
        - endDate
      properties:
        startDate:
          description: The date on which the current billing period started
          $ref: '#/components/schemas/Date'
          example: '2025-04-18T00:00:00Z'
        endDate:
          description: The date on which the current billing period is expected to end or to be renewed
          $ref: '#/components/schemas/Date'
          example: '2025-12-31T00:00:00Z'
        autoRenew:
          type: boolean
          description: Determines whether the current billing period will be extended renewalDays days once it ends
          example: true
          default: true
        renewalDays:
          $ref: '#/components/schemas/RenewalDays'

    ContractedService:
      type: object
      description: Map where keys are service names and values are pricing versions
      additionalProperties:
        type: string
        format: path
        description: Pricing version to which the user is subscribed
      example:
        zoom: "2025"
        petclinic: "2024"

    SubscriptionPlans:
      type: object
      description: Map of service name to plan name
      additionalProperties:
        type: string
        minLength: 1
      example:
        zoom: ENTERPRISE
        petclinic: GOLD

    SubscriptionAddons:
      type: object
      description: Map of service name to add-ons and quantities
      additionalProperties:
        type: object
        additionalProperties:
          type: integer
          minimum: 0
      example:
        zoom:
          extraSeats: 2
          hugeMeetings: 1
        petclinic:
          petsAdoptionCentre: 1

    UsageLevels:
      type: object
      description: Usage levels for contracted services
      additionalProperties:
        type: object
        additionalProperties:
          type: object
          required:
            - consumed
          properties:
            resetTimestamp:
              description: Reset timestamp (only for renewable usage limits)
              $ref: '#/components/schemas/Date'
            consumed:
              type: number
              description: Consumed quota for the usage limit
              example: 5
      example:
        zoom:
          maxSeats:
            consumed: 10
        petclinic:
          maxPets:
            consumed: 2
          maxVisits:
            consumed: 5
            resetTimestamp: "2025-07-31T00:00:00Z"

    SubscriptionSnapshot:
      type: object
      properties:
        startDate:
          description: The date on which the user started using the snapshot
          $ref: '#/components/schemas/Date'
          example: '2024-04-18T00:00:00Z'
        endDate:
          description: The date on which the user finished using the snapshot
          $ref: '#/components/schemas/Date'
          example: '2024-04-17T00:00:00Z'
        contractedServices:
          $ref: '#/components/schemas/ContractedService'
        subscriptionPlans:
          $ref: '#/components/schemas/SubscriptionPlans'
        subscriptionAddOns:
          $ref: '#/components/schemas/SubscriptionAddons'

    Date:
      type: string
      format: date-time
      description: Date in UTC
      example: '2025-12-31T00:00:00Z'

    ObjectId:
      type: string
      description: ObjectId of the corresponding MongoDB document
      example: 68050bd09890322c57842f6f
      pattern: '^[a-f0-9]{24}$'
      readOnly: true

    RenewalDays:
      type: integer
      description: Number of days by which the billing period will be extended
      example: 365
      default: 30
      minimum: 1

    Feature:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          example: Premium Support
        description:
          type: string
        service:
          type: string

  requestBodies:
    SubscriptionCreation:
      description: Creates a new subscription within SPACE
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - userContact
              - contractedServices
              - subscriptionPlans
              - subscriptionAddOns
            properties:
              userContact:
                $ref: '#/components/schemas/UserContact'
              billingPeriod:
                type: object
                properties:
                  autoRenew:
                    type: boolean
                    description: Whether the billing period auto-renews
                    example: true
                    default: true
                  renewalDays:
                    $ref: '#/components/schemas/RenewalDays'
              contractedServices:
                $ref: '#/components/schemas/ContractedService'
              subscriptionPlans:
                $ref: '#/components/schemas/SubscriptionPlans'
              subscriptionAddOns:
                $ref: '#/components/schemas/SubscriptionAddons'
          example:
            userContact:
              userId: 01c36d29-0d6a-4b41-83e9-8c6d9310c508
              username: johndoe
              firstName: John
              lastName: Doe
              email: john.doe@my-domain.com
            billingPeriod:
              autoRenew: true
              renewalDays: 30
            contractedServices:
              zoom: "2025"
              petclinic: "2024"
            subscriptionPlans:
              zoom: ENTERPRISE
              petclinic: GOLD
            subscriptionAddOns:
              zoom:
                extraSeats: 2
              petclinic:
                petsAdoptionCentre: 1

    SubscriptionCompositionNovation:
      description: Novates the composition of an existent contract
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - subscriptionPlans
              - subscriptionAddOns
            properties:
              contractedServices:
                $ref: '#/components/schemas/ContractedService'
              subscriptionPlans:
                $ref: '#/components/schemas/SubscriptionPlans'
              subscriptionAddOns:
                $ref: '#/components/schemas/SubscriptionAddons'
          example:
            contractedServices:
              zoom: "2025"
              petclinic: "2024"
            subscriptionPlans:
              zoom: PRO
              petclinic: GOLD
            subscriptionAddOns:
              zoom:
                extraSeats: 1

    SubscriptionUserContactNovation:
      description: Updates the contact information of a user from their contract
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              firstName:
                type: string
                example: John
              lastName:
                type: string
                example: Doe
              email:
                type: string
                example: john.doe@my-domain.com
              username:
                type: string
                example: johndoe
              phone:
                type: string
                example: +34 666 666 666

    SubscriptionBillingNovation:
      description: Updates the billing information from a contract
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              endDate:
                $ref: '#/components/schemas/Date'
              autoRenew:
                type: boolean
                example: true
                default: true
              renewalDays:
                $ref: '#/components/schemas/RenewalDays'
          example:
            endDate: '2025-12-31T00:00:00Z'
            autoRenew: true
            renewalDays: 30

    SubscriptionUsageLevelsUpdate:
      description: Updates usage levels for a contract
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties:
              type: object
              additionalProperties:
                type: number
          example:
            zoom:
              maxSeats: 10
            petclinic:
              maxPets: 2
              maxVisits: 5

  responses:
    UnprocessableEntity:
      description: Request sent could not be processed properly
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  $ref: '#/components/schemas/FieldValidationError'

  parameters:
    Username:
      name: username
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Username'

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: |
        API Key for authentication. Two types are supported:
        - **User API Key** (format: `usr_*`): Obtained from POST /users/authenticate endpoint
        - **Organization API Key** (format: `org_*`): Created in organization settings
