apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: server
  name: server-deployment
  namespace: space
spec:
  replicas: 3
  selector:
    matchLabels:
      app: server-pod
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: server-pod
    spec:
      containers:
      - name: space-server
        envFrom:
          - configMapRef:
              name: server-config
        env:
          # Pricing token signing key, shared by every replica (created by deploy.sh).
          - name: PRICING_TOKEN_PRIVATE_KEY_FILE
            value: /etc/space/pricing-token/private.pem
        image: space-api-space-server
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        livenessProbe:
          exec:
            command:
              - curl
              - -f
              - http://localhost:3000/api/v1/healthcheck
          failureThreshold: 5
          initialDelaySeconds: 30
          periodSeconds: 90
          timeoutSeconds: 30
        volumeMounts:
          - mountPath: /usr/src/server/public
            name: space-statics
          # Files that must not be served without authorisation (private SPHERE snapshots).
          - mountPath: /usr/src/server/private
            name: space-private
          - mountPath: /etc/space/pricing-token
            name: pricing-token-key
            readOnly: true
      restartPolicy: Always
      volumes:
        - name: space-statics
          persistentVolumeClaim:
            claimName: space-statics
        - name: space-private
          persistentVolumeClaim:
            claimName: space-private
        - name: pricing-token-key
          secret:
            secretName: space-pricing-token-key
            defaultMode: 0400
